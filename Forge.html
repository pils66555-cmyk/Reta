function RestTimer() {
  const [dur, setDur] = useState(90);
  const [left, setLeft] = useState(null);
  const ref = useRef(null);
  const beep = () => {
    try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.12; o.start(); o.stop(ctx.currentTime + 0.3); } catch (e) {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  };
  useEffect(() => {
    if (left === null) return;
    if (left <= 0) { beep(); setLeft(null); return; }
    ref.current = setTimeout(() => setLeft(left - 1), 1000);
    return () => clearTimeout(ref.current);
  }, [left]);
  const fmt = (s) => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  return (
    <div style={{ position: "sticky", bottom: 0, background: C.mode === "dark" ? "rgba(36,36,40,0.97)" : "rgba(246,247,250,0.97)", borderTop: `0.5px solid ${C.line}`, margin: "0 -20px", padding: "10px 20px", display: "flex", alignItems: "center", gap: 9, zIndex: 5 }}>
      <Icon d={IC.clock} size={17} color={left !== null ? C.accent : C.faint} />
      <span style={{fontFamily: NUM, fontWeight: 800, fontSize: 17, fontVariantNumeric: "tabular-nums", color: left !== null ? C.accent : C.sub, minWidth: 46 }}>{left !== null ? fmt(left) : fmt(dur)}</span>
      <div style={{ display: "flex", gap: 6, flex: 1 }}>
        {[60, 90, 120, 180].map((s) => (
          <button key={s} onClick={() => setDur(s)} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: `1px solid ${dur === s ? C.accent : C.line}`, background: dur === s ? C.accentSoft : C.card2, color: dur === s ? C.accent : C.sub, fontWeight: 700, fontSize: 12, fontFamily: FONT, cursor: "pointer" }}>{s}s</button>
        ))}
      </div>
      <button onClick={() => setLeft(left !== null ? null : dur)} style={{ padding: "8px 14px", borderRadius: 10, border: "none", background: left !== null ? "rgba(255,107,107,0.14)" : C.accent, color: left !== null ? C.bad : "#fff", fontWeight: 800, fontSize: 13, fontFamily: FONT, cursor: "pointer" }}>{left !== null ? "Stop" : "Repos"}</button>
    </div>
  );
}

const upperReps = (setsStr) => { const m = String(setsStr).match(/(\d+)(?!.*\d)/); return m ? +m[1] : 12; };
const recSets = (setsStr) => { const m = String(setsStr).match(/^(\d+)/); return m ? +m[1] : 3; };

function SessionLogger({ split, profile, exos, workouts, onSave, onClose, editing, onDelete }) {
  // En modification, on repart des séries déjà enregistrées
  const [data, setData] = useState(() => {
    const base = Object.fromEntries(exos.map((e) => [e.id, []]));
    if (editing) (editing.exos || []).forEach((ex) => {
      const match = exos.find((e) => e.name === ex.name);
      if (match) base[match.id] = ex.sets.map((s) => ({ kg: String(s.kg ?? ""), reps: String(s.reps ?? "") }));
    });
    return base;
  });
  const [duree, setDuree] = useState(editing ? String(editing.duree || 60) : String((SPLITS[split] && SPLITS[split].duree) || 60));
  const [openExo, setOpenExo] = useState(exos[0]?.id);
  const [showKcalInfo, setShowKcalInfo] = useState(false);
  const [detail, setDetail] = useState(null);

  const lastPerf = useMemo(() => {
    const map = {};
    exos.forEach((e) => { const h = exoHistory(workouts, e.name); if (h.length) map[e.id] = h[h.length - 1]; });
    return map;
  }, [exos, workouts]);

  const suggest = (e) => {
    const lp = lastPerf[e.id];
    if (!lp) return null;
    const up = upperReps(e.sets), ns = recSets(e.sets);
    const good = lp.sets.filter((s) => s.reps >= up);
    return good.length >= ns ? lp.v + 2.5 : null;
  };

  const addSet = (id) => setData((d) => { const sets = d[id]; const last = sets[sets.length - 1] || { kg: "", reps: "" }; return { ...d, [id]: [...sets, { kg: last.kg, reps: last.reps }] }; });
  const upSet = (id, i, k, v) => setData((d) => ({ ...d, [id]: d[id].map((s, j) => (j === i ? { ...s, [k]: v } : s)) }));
  const rmSet = (id, i) => setData((d) => ({ ...d, [id]: d[id].filter((_, j) => j !== i) }));
  const doneCount = exos.filter((e) => data[e.id].length > 0).length;
  const volume = exos.reduce((s, e) => s + data[e.id].reduce((v, st) => v + (+st.kg || 0) * (+st.reps || 0), 0), 0);
  const totalSets = exos.reduce((s, e) => s + data[e.id].length, 0);
  const estKcal = kcalMuscu(profile.poids, +duree || 60, split, totalSets);

  const save = () => {
    const exosDone = exos.filter((e) => data[e.id].length).map((e) => ({ name: e.name, sets: data[e.id].map((s) => ({ kg: +s.kg || 0, reps: +s.reps || 0 })) }));
    const min = +duree || 60;
    onSave({
      id: editing ? editing.id : uid(),
      date: editing ? editing.date : dateKey(),
      type: "muscu", split, duree: min, exos: exosDone,
      volume: Math.round(volume), kcal: kcalMuscu(profile.poids, min, split, totalSets),
    });
  };

  return (
    <Sheet open onClose={onClose} title={editing ? `Modifier · ${SPLITS[split].label}` : `Séance ${SPLITS[split].label}`} full footer={
      <Btn disabled={doneCount === 0} onClick={save}>{editing ? "Enregistrer les modifications" : "Terminer la séance"}</Btn>
    }>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        <div style={{ display: "flex", gap: 8, background: C.card2, borderRadius: 14, padding: 13, justifyContent: "space-around" }}>
          {[["Exercices", `${doneCount}/${exos.length}`], ["Volume", `${(volume / 1000).toFixed(1)} t`], ["Durée", `${duree || 0} min`], ["Est.", `${estKcal} kcal`]].map(([l, v]) => (
            <div key={l} style={{ textAlign: "center" }}><div style={{fontFamily: NUM, fontWeight: 800, fontSize: 16, fontVariantNumeric: "tabular-nums" }}>{v}</div><div style={{ fontSize: 10.5, color: C.faint, fontWeight: 700 }}>{l}</div></div>
          ))}
        </div>
        <button onClick={() => setShowKcalInfo(!showKcalInfo)} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: C.faint, fontSize: 12, fontWeight: 700, fontFamily: FONT, cursor: "pointer", alignSelf: "center", padding: "0 0 2px" }}>
          <Icon d={IC.bulb} size={13} /> Comment c'est calculé ?
        </button>
        {showKcalInfo && (
          <div style={{ background: C.card2, borderRadius: 13, padding: 13, fontSize: 12.5, color: C.sub, lineHeight: 1.6 }}>
            L'estimation se base sur tes <b style={{ color: C.text }}>{totalSets} série{totalSets > 1 ? "s" : ""}</b> effectuées (≈{SET_ACTIVE_SECONDS}s de travail réel chacune) et le reste du temps en récupération. Le groupe musculaire compte aussi : {SPLITS[split].label} utilise un coût énergétique différent (jambes {">"} dos/pull {">"} push, car la masse musculaire mobilisée diffère). Plus tu ajoutes de séries, plus l'estimation monte — la durée seule ne suffit pas.
          </div>
        )}
        {exos.map((e) => {
          const open = openExo === e.id;
          const sets = data[e.id];
          const lp = lastPerf[e.id];
          const sug = suggest(e);
          return (
            <div key={e.id} style={{ background: C.card2, borderRadius: 16, border: `1px solid ${sets.length ? SPLITS[split].color + "44" : C.line}`, overflow: "hidden" }}>
              <div style={{ display: "flex", alignItems: "center", padding: "13px 14px", gap: 10 }}>
                <button onClick={() => setOpenExo(open ? null : e.id)} style={{ flex: 1, background: "none", border: "none", textAlign: "left", cursor: "pointer", fontFamily: FONT, padding: 0, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: C.text, display: "flex", alignItems: "center", gap: 7 }}>
                    {sets.length > 0 && <Icon d={IC.check} size={14} color={SPLITS[split].color} sw={3} />}{e.name}
                  </div>
                  <div style={{ fontSize: 12.5, color: C.faint, marginTop: 2 }}>
                    {e.sets}{lp ? ` · dern. : ${lp.sets.filter((s) => s.reps > 0).slice(0, 3).map((s) => `${s.kg}×${s.reps}`).join(" ")}` : ""}
                  </div>
                  {sug && <div style={{ display: "inline-flex", alignItems: "center", gap: 5, marginTop: 5, padding: "3px 9px", borderRadius: 100, background: "rgba(47,191,119,0.14)", color: C.good, fontSize: 11.5, fontWeight: 800 }}><Icon d={IC.trend} size={12} /> Passe à {sug} kg</div>}
                </button>
                <button onClick={() => setDetail(e)} style={{ background: C.card, border: `1px solid ${C.line}`, borderRadius: 9, width: 30, height: 30, color: C.sub, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon d={IC.book} size={15} /></button>
                <Icon d={IC.chevR} size={16} color={C.faint} />
              </div>
              {open && (
                <div style={{ padding: "0 14px 13px" }}>
                  {sets.map((s, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8 }}>
                      <div style={{ width: 24, textAlign: "center", color: C.faint, fontWeight: 800, fontSize: 13 }}>{i + 1}</div>
                      <div style={{ flex: 1, display: "flex", alignItems: "center", background: C.card, borderRadius: 11, border: `1px solid ${C.line}`, padding: "0 11px" }}>
                        <input inputMode="decimal" value={s.kg} placeholder={lp ? String(lp.v) : "0"} onChange={(ev) => upSet(e.id, i, "kg", ev.target.value.replace(",", "."))} style={{ width: "100%", background: "none", border: "none", outline: "none", color: C.text, fontSize: 15.5, fontWeight: 700, fontFamily: FONT, padding: "10px 0", fontVariantNumeric: "tabular-nums" }} />
                        <span style={{ color: C.faint, fontSize: 12.5, fontWeight: 700 }}>kg</span>
                      </div>
                      <span style={{ color: C.faint, fontWeight: 700 }}>×</span>
                      <div style={{ flex: 1, display: "flex", alignItems: "center", background: C.card, borderRadius: 11, border: `1px solid ${C.line}`, padding: "0 11px" }}>
                        <input inputMode="numeric" value={s.reps} placeholder="0" onChange={(ev) => upSet(e.id, i, "reps", ev.target.value)} style={{ width: "100%", background: "none", border: "none", outline: "none", color: C.text, fontSize: 15.5, fontWeight: 700, fontFamily: FONT, padding: "10px 0", fontVariantNumeric: "tabular-nums" }} />
                        <span style={{ color: C.faint, fontSize: 12.5, fontWeight: 700 }}>reps</span>
                      </div>
                      <button onClick={() => rmSet(e.id, i)} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 3 }}><Icon d={IC.x} size={14} /></button>
                    </div>
                  ))}
                  <button onClick={() => addSet(e.id)} style={{ width: "100%", padding: "10px 0", borderRadius: 11, border: `1.5px dashed ${C.line}`, background: "none", color: C.sub, fontWeight: 700, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>+ Ajouter une série</button>
                </div>
              )}
            </div>
          );
        })}
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
          <Field label="Durée de la séance" value={duree} onChange={setDuree} suffix="min" />
        </div>
        {editing && onDelete && <Btn kind="danger" onClick={() => { onDelete(editing.id); onClose(); }}>Supprimer cette séance</Btn>}
        <RestTimer />
      </div>
      <ExoDetail exo={detail} onClose={() => setDetail(null)} workouts={workouts} />
    </Sheet>
  );
}

function CardioLogger({ profile, onSave, onClose, customCardio, addCustomCardio, deleteCustomCardio, dayBurn = 0, calTarget = 0 }) {
  const [type, setType] = useState(CARDIO_TYPES[0].id);
  const [sub, setSub] = useState(null);
  const [min, setMin] = useState("30");
  const [km, setKm] = useState("");
  const [incl, setIncl] = useState("");
  const [deniv, setDeniv] = useState("");
  const [creating, setCreating] = useState(false);
  const [nf, setNf] = useState({ label: "", met: "7" });
  const t = cardioType(type);
  const met = cardioMet(type, sub);
  const kcal = kcalCardioTotal({ met, poids: profile.poids, min: +min || 0, inclinaison: incl, denivele: deniv });
  const [kcalEdit, setKcalEdit] = useState(null);
  useEffect(() => setKcalEdit(null), [type, sub, min, incl, deniv]);
  const champPente = CARDIO_PENTE[type] || null;
  useEffect(() => { setSub(t.subs ? t.subs[Math.min(1, t.subs.length - 1)].id : null); }, [type]);
  const finalKcal = +(kcalEdit ?? kcal) || 0;

  if (creating) {
    return (
      <Sheet open onClose={onClose} title="Nouvelle activité cardio">
        <div style={{ display: "flex", flexDirection: "column", gap: 15 }}>
          <Field label="Nom de l'activité" type="text" value={nf.label} onChange={(v) => setNf({ ...nf, label: v })} placeholder="Ex : Escalade, Padel, Danse…" />
          <div>
            <Label style={{ marginBottom: 7 }}>Intensité (MET)</Label>
            <div style={{ display: "flex", gap: 8 }}>
              {[["Douce", 4], ["Modérée", 6], ["Soutenue", 8], ["Intense", 11]].map(([l, v]) => (
                <button key={l} onClick={() => setNf({ ...nf, met: String(v) })} style={{ flex: 1, padding: "11px 0", borderRadius: 12, border: `1.5px solid ${+nf.met === v ? C.accent : C.line}`, background: +nf.met === v ? C.accentSoft : C.card2, color: +nf.met === v ? C.accent : C.sub, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer" }}>{l}</button>
              ))}
            </div>
            <div style={{ fontSize: 12, color: C.faint, marginTop: 7, lineHeight: 1.45 }}>Sert au calcul des calories : ≈ {kcalCardio(+nf.met || 6, profile.poids, 30)} kcal pour 30 min à ton poids.</div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn kind="ghost" style={{ width: 90 }} onClick={() => setCreating(false)}>Retour</Btn>
            <Btn disabled={!nf.label.trim()} onClick={() => {
              const c = { id: "cc" + uid(), label: nf.label.trim(), met: +nf.met || 6, icon: "bolt" };
              addCustomCardio(c); setType(c.id); setCreating(false);
            }}>Créer</Btn>
          </div>
        </div>
      </Sheet>
    );
  }

  return (
    <Sheet open onClose={onClose} title="Séance cardio" full footer={
      <Btn disabled={!+min} onClick={() => onSave({ id: uid(), date: dateKey(), type: "cardio", cardioType: type, cardioSub: sub, duree: +min, km: +km || null, inclinaison: +incl || null, denivele: +deniv || null, kcal: finalKcal })}>Enregistrer la séance</Btn>
    }>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          {CARDIO_TYPES.map((c) => (
            <button key={c.id} onClick={() => setType(c.id)} style={{ position: "relative", display: "flex", alignItems: "center", gap: 9, padding: "12px 13px", borderRadius: 14, border: `1.5px solid ${type === c.id ? C.fat : C.line}`, background: type === c.id ? "rgba(255,184,77,0.1)" : C.card2, color: type === c.id ? C.fat : C.sub, fontWeight: 700, fontSize: 13.5, fontFamily: FONT, cursor: "pointer", textAlign: "left" }}>
              <Icon d={IC[c.icon]} size={18} />
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.label}</span>
              {c.custom && (
                <span onClick={(e) => { e.stopPropagation(); deleteCustomCardio(c.id); if (type === c.id) setType(CARDIO_TYPES[0].id); }} style={{ position: "absolute", top: 4, right: 5, padding: 3, color: C.faint }}>
                  <Icon d={IC.x} size={12} />
                </span>
              )}
            </button>
          ))}
          <button onClick={() => setCreating(true)} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 13px", borderRadius: 14, border: `1.5px dashed ${C.accent}66`, background: "transparent", color: C.accent, fontWeight: 700, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>
            <Icon d={IC.plus} size={16} /> Autre activité
          </button>
        </div>

        {t.subs && (
          <div>
            <Label style={{ marginBottom: 8 }}>{type === "natation" ? "Type de nage" : "Intensité"}</Label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {t.subs.map((s) => (
                <button key={s.id} onClick={() => setSub(s.id)} style={{ padding: "8px 13px", borderRadius: 100, border: `1px solid ${sub === s.id ? C.fat : C.line}`, background: sub === s.id ? "rgba(255,184,77,0.12)" : C.card2, color: sub === s.id ? C.fat : C.sub, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer" }}>{s.label}</button>
              ))}
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 10 }}>
          <Field label="Durée" value={min} onChange={setMin} suffix="min" />
          <Field label="Distance (opt.)" value={km} onChange={setKm} suffix="km" />
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <Field label="Inclinaison (opt.)" value={incl} onChange={setIncl} suffix="%" />
          <Field label="Dénivelé + (opt.)" value={deniv} onChange={setDeniv} suffix="m" />
        </div>
        {(+incl > 0 || +deniv > 0) && (
          <div style={{ fontSize: 12.5, color: C.sub, lineHeight: 1.5, marginTop: -6 }}>
            {+incl > 0 && <>Pente {clamp(+incl, 0, 15)} % : intensité relevée. </>}
            {+deniv > 0 && <>Dénivelé {Math.round(+deniv)} m : <b style={{ color: C.text }}>+{kcalDenivele(profile.poids, deniv)} kcal</b> de montée.</>}
          </div>
        )}
        <Field label="Calories brûlées (estimation auto)" value={kcalEdit ?? kcal} onChange={setKcalEdit} suffix="kcal" />

        {/* Effet direct sur le budget alimentaire du jour */}
        {calTarget > 0 && (
          <div style={{ background: "rgba(47,191,119,0.09)", border: "1px solid rgba(47,191,119,0.25)", borderRadius: 14, padding: 13, fontSize: 13.5, color: C.text, lineHeight: 1.6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 4 }}>
              <Icon d={IC.flame} size={15} color={C.good} />
              <b>Budget du jour : {calTarget + dayBurn + finalKcal} kcal</b>
            </div>
            <span style={{ color: C.sub }}>{calTarget} kcal d'objectif {dayBurn > 0 ? `+ ${dayBurn} déjà brûlées ` : ""}+ <b style={{ color: C.good }}>{finalKcal}</b> de cette séance.</span>
          </div>
        )}

      </div>
    </Sheet>
  );
}

function CustomizeSheet({ open, onClose, allExos, program, setProgram, addCustomExo, deleteCustomExo, initialCreating, customSplits, addCustomSplit, deleteCustomSplit, programSplitIds }) {
  const [split, setSplit] = useState((programSplitIds || ["push"])[0]);
  const [mode, setMode] = useState("exos"); // exos | newExo | newSplit
  const [nf, setNf] = useState({ name: "", split: "push", equip: "", sets: "3 × 10-12", prim: [], steps: "" });
  const [ns, setNs] = useState({ label: "", desc: "", color: SPLIT_COLORS[3], met: 5.5, exos: [] });
  useEffect(() => { setMode(open && initialCreating ? "newExo" : "exos"); }, [open, initialCreating]);

  const splitIds = [...(programSplitIds || ["push", "pull", "legs"]), ...(customSplits || []).map((c) => c.id)];
  const isCustom = SPLITS[split] && (SPLITS[split].custom || SPLITS[split].preset);
  const enabled = (s) => program?.[s] || (SPLITS[s] && SPLITS[s].preset ? presetExoIds(s, allExos) : SPLITS[s] && SPLITS[s].custom ? [] : allExos.filter((e) => e.split === s).map((e) => e.id));
  const toggle = (s, id) => {
    const cur = enabled(s);
    const next = cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id];
    if (next.length === 0 && !(SPLITS[s] && SPLITS[s].custom)) return;
    setProgram({ ...(program || {}), [s]: next });
  };
  const togglePrim = (m) => setNf((p) => ({ ...p, prim: p.prim.includes(m) ? p.prim.filter((x) => x !== m) : [...p.prim, m] }));
  const toggleNsExo = (id) => setNs((p) => ({ ...p, exos: p.exos.includes(id) ? p.exos.filter((x) => x !== id) : [...p.exos, id] }));
  // pour une séance personnalisée, on peut piocher dans TOUS les exercices
  const listForSplit = isCustom ? allExos : allExos.filter((e) => e.split === split);

  const title = mode === "newExo" ? "Créer un exercice" : mode === "newSplit" ? "Créer une séance" : "Personnaliser le programme";

  return (
    <Sheet open={open} onClose={onClose} title={title} full>
      {mode === "newSplit" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.5 }}>Crée ta propre séance (Bras & Épaules, Jambes avant, Haut du corps…) et choisis les exercices qu'elle contient, quel que soit leur groupe d'origine.</div>
          <Field label="Nom de la séance" type="text" value={ns.label} onChange={(v) => setNs({ ...ns, label: v })} placeholder="Ex : Bras & Épaules" />
          <Field label="Description (optionnel)" type="text" value={ns.desc} onChange={(v) => setNs({ ...ns, desc: v })} placeholder="Biceps · Triceps · Deltoïdes" />
          <div>
            <Label style={{ marginBottom: 8 }}>Couleur</Label>
            <div style={{ display: "flex", gap: 9, flexWrap: "wrap" }}>
              {SPLIT_COLORS.map((col) => (
                <button key={col} onClick={() => setNs({ ...ns, color: col })} style={{ width: 34, height: 34, borderRadius: "50%", background: col, border: ns.color === col ? `3px solid ${C.text}` : "3px solid transparent", outline: `1px solid ${C.line}`, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 }}>
                  {ns.color === col && <Icon d={IC.check} size={14} color="#fff" sw={3.4} />}
                </button>
              ))}
            </div>
          </div>
          <div>
            <Label style={{ marginBottom: 8 }}>Exercices ({ns.exos.length} sélectionné{ns.exos.length > 1 ? "s" : ""})</Label>
            <div style={{ display: "flex", flexDirection: "column", gap: 7, maxHeight: 300, overflowY: "auto" }}>
              {allExos.map((e) => {
                const on = ns.exos.includes(e.id);
                return (
                  <button key={e.id} onClick={() => toggleNsExo(e.id)} style={{ display: "flex", alignItems: "center", gap: 11, padding: "10px 12px", background: C.card2, borderRadius: 13, border: `1px solid ${on ? ns.color : C.line}`, cursor: "pointer", fontFamily: FONT, textAlign: "left" }}>
                    <span style={{ width: 22, height: 22, borderRadius: 7, border: `1.5px solid ${on ? ns.color : C.faint}`, background: on ? ns.color : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      {on && <Icon d={IC.check} size={12} color="#fff" sw={3.5} />}
                    </span>
                    <span style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ display: "block", fontWeight: 700, fontSize: 14, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.name}</span>
                      <span style={{ display: "block", fontSize: 11.5, color: C.faint }}>{e.prim.map((m) => MUSCLE_LABELS[m]).join(" · ")}</span>
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn kind="ghost" style={{ width: 90 }} onClick={() => setMode("exos")}>Retour</Btn>
            <Btn disabled={!ns.label.trim() || ns.exos.length === 0} onClick={() => {
              const id = "cs" + uid();
              addCustomSplit({ id, label: ns.label.trim(), desc: ns.desc.trim(), color: ns.color, met: ns.met, exos: ns.exos });
              setProgram({ ...(program || {}), [id]: ns.exos });
              setNs({ label: "", desc: "", color: SPLIT_COLORS[3], met: 5.5, exos: [] });
              setSplit(id); setMode("exos");
            }}>Créer la séance</Btn>
          </div>
        </div>
      ) : mode === "newExo" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Nom de l'exercice" type="text" value={nf.name} onChange={(v) => setNf({ ...nf, name: v })} placeholder="Ex : Développé décliné" />
          <div>
            <Label style={{ marginBottom: 8 }}>Groupe</Label>
            <div style={{ display: "flex", gap: 8 }}>
              {["push", "pull", "legs"].map((s) => (
                <button key={s} onClick={() => setNf({ ...nf, split: s })} style={{ flex: 1, padding: "11px 0", borderRadius: 12, border: `1.5px solid ${nf.split === s ? SPLITS[s].color : C.line}`, background: nf.split === s ? SPLITS[s].color + "20" : C.card2, color: nf.split === s ? SPLITS[s].color : C.sub, fontWeight: 800, fontSize: 14, fontFamily: FONT, cursor: "pointer" }}>{SPLITS[s].label}</button>
              ))}
            </div>
          </div>
          <div>
            <Label style={{ marginBottom: 8 }}>Muscles ciblés</Label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
              {Object.entries(MUSCLE_LABELS).map(([m, l]) => (
                <button key={m} onClick={() => togglePrim(m)} style={{ padding: "6px 12px", borderRadius: 100, border: `1px solid ${nf.prim.includes(m) ? C.accent : C.line}`, background: nf.prim.includes(m) ? C.accentSoft : C.card2, color: nf.prim.includes(m) ? C.accent : C.sub, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer" }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Field label="Séries × reps" type="text" value={nf.sets} onChange={(v) => setNf({ ...nf, sets: v })} />
            <Field label="Matériel" type="text" value={nf.equip} onChange={(v) => setNf({ ...nf, equip: v })} placeholder="Haltères" />
          </div>
          <div>
            <Label style={{ marginBottom: 7 }}>Exécution <span style={{ color: C.faint, textTransform: "none", letterSpacing: 0 }}>(une étape par ligne, optionnel)</span></Label>
            <textarea value={nf.steps} onChange={(e) => setNf({ ...nf, steps: e.target.value })} rows={4} style={{ width: "100%", background: C.card2, border: `1px solid ${C.line}`, borderRadius: 14, color: C.text, fontSize: 14.5, fontFamily: FONT, padding: 13, outline: "none", resize: "vertical", boxSizing: "border-box" }} />
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn kind="ghost" style={{ width: 90 }} onClick={() => setMode("exos")}>Retour</Btn>
            <Btn disabled={!nf.name.trim() || nf.prim.length === 0} onClick={() => {
              addCustomExo({ id: "cx" + uid(), split: nf.split, name: nf.name.trim(), equip: nf.equip.trim(), sets: nf.sets.trim() || "3 × 10-12", prim: nf.prim, sec: [], steps: nf.steps.split("\n").map((s) => s.trim()).filter(Boolean), tips: "", err: "" });
              setNf({ name: "", split: nf.split, equip: "", sets: "3 × 10-12", prim: [], steps: "" });
              setMode("exos");
            }}>Créer</Btn>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.5 }}>Active ou désactive les exercices de chaque séance, crée les tiens, ou crée une séance sur mesure.</div>
          <div style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 3 }}>
            {splitIds.map((s) => (
              <button key={s} onClick={() => setSplit(s)} style={{ flexShrink: 0, padding: "10px 15px", borderRadius: 12, border: "none", background: split === s ? SPLITS[s].color + "26" : C.card2, color: split === s ? SPLITS[s].color : C.sub, fontWeight: 800, fontSize: 13.5, fontFamily: FONT, cursor: "pointer", whiteSpace: "nowrap" }}>{SPLITS[s].label}</button>
            ))}
            <button onClick={() => setMode("newSplit")} style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: 5, padding: "10px 14px", borderRadius: 12, border: `1.5px dashed ${C.accent}66`, background: "transparent", color: C.accent, fontWeight: 800, fontSize: 13, fontFamily: FONT, cursor: "pointer", whiteSpace: "nowrap" }}>
              <Icon d={IC.plus} size={14} sw={2.6} /> Séance
            </button>
          </div>

          {SPLITS[split] && SPLITS[split].custom && (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.card2, borderRadius: 13, padding: "11px 13px" }}>
              <span style={{ fontSize: 12.5, color: C.sub }}>Séance personnalisée</span>
              <button onClick={() => { deleteCustomSplit(split); setSplit("push"); }} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: C.bad, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer" }}>
                <Icon d={IC.trash} size={14} /> Supprimer
              </button>
            </div>
          )}

          {listForSplit.map((e) => {
            const on = enabled(split).includes(e.id);
            const isCx = e.id.startsWith("cx");
            const col = SPLITS[split].color;
            return (
              <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 11, padding: "11px 13px", background: C.card2, borderRadius: 14, border: `1px solid ${on ? col + "44" : C.line}`, opacity: on ? 1 : 0.55 }}>
                <button onClick={() => toggle(split, e.id)} style={{ width: 24, height: 24, borderRadius: 8, border: `1.5px solid ${on ? col : C.faint}`, background: on ? col : "transparent", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  {on && <Icon d={IC.check} size={13} color="#fff" sw={3.5} />}
                </button>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.name}{isCx && <span style={{ fontSize: 10.5, color: C.accent, fontWeight: 800, marginLeft: 7 }}>PERSO</span>}</div>
                  <div style={{ fontSize: 12, color: C.faint }}>{e.prim.map((m) => MUSCLE_LABELS[m]).join(" · ")}</div>
                </div>
                {isCx && <button onClick={() => deleteCustomExo(e.id)} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 4 }}><Icon d={IC.trash} size={15} /></button>}
              </div>
            );
          })}
          <button onClick={() => { setMode("newExo"); setNf((p) => ({ ...p, split: isCustom ? "push" : split })); }} style={{ display: "flex", alignItems: "center", gap: 11, padding: "13px 14px", borderRadius: 14, border: `1.5px dashed ${C.accent}66`, background: "transparent", color: C.accent, fontWeight: 700, fontSize: 14.5, fontFamily: FONT, cursor: "pointer" }}>
            <Icon d={IC.plus} size={17} /> Créer un exercice
          </button>
        </div>
      )}
    </Sheet>
  );
}

  const [lib, setLib] = useState(programSplits(profile)[0]);

  const [editDay, setEditDay] = useState(null); // date dont on change la séance
  const [editWorkout, setEditWorkout] = useState(null); // séance déjà enregistrée à corriger
  const days = weekDates(0);
  const todayList = plannedList(dateKey(), plan, week);
  const today = todayList.length ? todayList[0] : "repos";
  const doneByDate = useMemo(() => {
    const m = {};
    workouts.forEach((w) => { const t = w.type === "cardio" ? "cardio" : w.split; (m[w.date] = m[w.date] || []).push(t); });
    return m;
  }, [workouts]);
  const quota = planQuota(plan, week, profile, 0);
  const enabledExos = (s) => exosForSplit(s, allExos, program);
  const allSplitIds = [...programSplits(profile), ...(customSplits || []).map((c) => c.id), "cardio"];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ padding: "4px 2px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div>
          <div style={{ fontSize: 34, fontWeight: 700, letterSpacing: -1 }}>Entraînement</div>
          <div style={{ color: C.sub, fontSize: 13.5, fontWeight: 600, marginTop: 2 }}>{(PROGRAMMES.find((p) => p.id === (profile.programType || "split4")) || PROGRAMMES[0]).label} · {profile.muscuDays} muscu + {profile.cardioDays} cardio / sem</div>
        </div>
        <button onClick={() => setCustomize("list")} style={{ display: "flex", alignItems: "center", gap: 6, background: C.card, border: `1px solid ${C.line}`, borderRadius: 100, padding: "9px 14px", color: C.sub, fontWeight: 700, fontSize: 13, fontFamily: FONT, cursor: "pointer" }}><Icon d={IC.sliders} size={15} /> Modifier</button>
      </div>

      {/* Planning libre — plusieurs blocs possibles par jour */}
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <Label>Mon planning</Label>
          <span style={{ fontSize: 11.5, color: C.faint, fontWeight: 700 }}>touche un jour pour composer</span>
        </div>
        {/* Quota hebdomadaire à respecter */}
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {[["Salle", quota.muscu, quota.goalM, SPLITS.push.color], ["Cardio", quota.cardio, quota.goalC, SPLITS.cardio.color]].map(([l, val, goal, col]) => {
            const ok = val >= goal;
            const trop = goal > 0 && val > goal;
            return (
              <div key={l} style={{ flex: 1, background: C.card2, borderRadius: 12, padding: "9px 11px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                  <span style={{ fontSize: 11.5, fontWeight: 800, color: C.sub }}>{l}</span>
                  <span style={{fontFamily: NUM, fontSize: 13.5, fontWeight: 800, fontVariantNumeric: "tabular-nums", color: trop ? C.fat : ok ? C.good : C.text }}>{val}<span style={{ color: C.faint, fontWeight: 600 }}> / {goal}</span></span>
                </div>
                <div style={{ height: 4.5, background: C.track, borderRadius: 3, overflow: "hidden", marginTop: 6 }}>
                  <div style={{ width: `${goal > 0 ? clamp(val / goal, 0, 1) * 100 : 0}%`, height: "100%", background: trop ? C.fat : ok ? C.good : col, borderRadius: 3 }} />
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 5, alignItems: "stretch" }}>
          {days.map((dk, i) => {
            const list = plannedList(dk, plan, week);
            const isT = dk === dateKey();
            const done = doneByDate[dk] || [];
            return (
              <button key={dk} onClick={() => setEditDay(dk)} style={{ flex: 1, background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: FONT, display: "flex", flexDirection: "column", gap: 4 }}>
                <div style={{ fontSize: 10, color: isT ? C.accent : C.faint, fontWeight: 800, textAlign: "center" }}>{JOURS_S[i]}</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 3, minHeight: 46, justifyContent: list.length ? "flex-start" : "center", border: `1.5px solid ${isT ? C.accent : "transparent"}`, borderRadius: 10, padding: 2 }}>
                  {list.length === 0 && (
                    <div style={{ height: 40, borderRadius: 8, background: C.track, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8.5, fontWeight: 800, color: C.faint }}>Repos</div>
                  )}
                  {list.map((s, k) => {
                    const sp = SPLITS[s] || { label: s, color: C.sub };
                    const fait = done.includes(s);
                    return (
                      <div key={k} style={{ position: "relative", height: list.length > 1 ? 20 : 40, borderRadius: 8, background: sp.color + "26", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 800, color: sp.color, overflow: "hidden" }}>
                        {sp.court || sp.label}
                        {fait && <span style={{ position: "absolute", top: 1, right: 1, width: 11, height: 11, borderRadius: "50%", background: C.good, display: "flex", alignItems: "center", justifyContent: "center" }}><Icon d={IC.check} size={7} color="#fff" sw={4.5} /></span>}

                  })}

      </Card>

      {/* Lancer une séance */}
      <Card style={{ background: today !== "repos" ? `linear-gradient(135deg, ${SPLITS[today].color}22, ${C.card} 60%)` : C.card }}>
        <Label style={{ marginBottom: 10 }}>Démarrer une séance</Label>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
          {allSplitIds.map((s, idx) => (
            <button key={s} onClick={() => (s === "cardio" ? setCardio(true) : setLogger(s))} style={{ gridColumn: idx === allSplitIds.length - 1 && allSplitIds.length % 2 ? "span 2" : "auto", padding: "15px 13px", borderRadius: 15, border: `1.5px solid ${todayList.includes(s) ? SPLITS[s].color : C.line}`, background: SPLITS[s].color + (todayList.includes(s) ? "22" : "10"), cursor: "pointer", fontFamily: FONT, textAlign: "left", position: "relative" }}>
              {todayList.includes(s) && <span style={{ position: "absolute", top: 9, right: 10, fontSize: 9, fontWeight: 800, color: SPLITS[s].color, letterSpacing: 0.8 }}>AUJOURD'HUI</span>}

              <div style={{ fontWeight: 800, fontSize: 16, color: C.text, marginTop: 7 }}>{SPLITS[s].label}</div>
              <div style={{ fontSize: 11.5, color: C.sub, marginTop: 2, lineHeight: 1.35 }}>{s === "cardio" ? SPLITS[s].desc : `${enabledExos(s).length} exercices`}</div>

          ))}

      </Card>

      {/* Bibliothèque */}
      <Card style={{ padding: 0, overflow: "hidden" }}>

          </div>
          <div style={{ display: "flex", gap: 7, marginBottom: 6, overflowX: "auto", paddingBottom: 3 }}>
            {[...programSplits(profile), ...(customSplits || []).map((c) => c.id)].map((s) => (
              <button key={s} onClick={() => setLib(s)} style={{ flexShrink: 0, flex: "1 0 auto", padding: "9px 14px", borderRadius: 11, border: "none", background: lib === s ? SPLITS[s].color + "26" : C.card2, color: lib === s ? SPLITS[s].color : C.sub, fontWeight: 800, fontSize: 13.5, fontFamily: FONT, cursor: "pointer", whiteSpace: "nowrap" }}>{SPLITS[s].label}</button>

        <div>

            <button key={e.id} onClick={() => setDetail(e)} style={{ display: "flex", alignItems: "center", width: "100%", gap: 12, padding: "13px 16px", background: "none", border: "none", borderTop: `1px solid ${C.line}`, cursor: "pointer", fontFamily: FONT, textAlign: "left" }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: C.text, fontWeight: 700, fontSize: 14.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.name}</div>
                <div style={{ color: C.faint, fontSize: 12, marginTop: 2 }}>{e.prim.map((m) => MUSCLE_LABELS[m]).join(" · ")}</div>
              </div>
              <span style={{ fontSize: 12, color: C.sub, fontWeight: 700, background: C.card2, padding: "4px 9px", borderRadius: 8, whiteSpace: "nowrap" }}>{e.sets}</span>

          ))}

      {logger && <SessionLogger split={logger} profile={profile} exos={enabledExos(logger)} workouts={workouts} onClose={() => setLogger(null)} onSave={(w) => { onSaveWorkout(w); setLogger(null); }} />}
      {editWorkout && editWorkout.type === "muscu" && (
        <SessionLogger
          split={editWorkout.split}
          profile={profile}
          exos={(() => {
            // on garde les exercices du programme + ceux déjà loggés (même s'ils en sont sortis depuis)
            const base = enabledExos(editWorkout.split);
            const manquants = (editWorkout.exos || [])
              .filter((ex) => !base.some((e) => e.name === ex.name))
              .map((ex) => allExos.find((e) => e.name === ex.name))

          })()}
          workouts={workouts}
          editing={editWorkout}
          onDelete={(id) => { onDeleteWorkout(id); setEditWorkout(null); }}
          onClose={() => setEditWorkout(null)}
          onSave={(w) => { onUpdateWorkout(w); setEditWorkout(null); }}

      {cardio && <CardioLogger profile={profile} onClose={() => setCardio(false)} onSave={(w) => { onSaveWorkout(w); setCardio(false); }} customCardio={customCardio} addCustomCardio={addCustomCardio} deleteCustomCardio={deleteCustomCardio} dayBurn={dayBurn} calTarget={calTarget} />}

      <CustomizeSheet open={!!customize} initialCreating={customize === "create"} onClose={() => setCustomize(null)} allExos={allExos} program={program} setProgram={setProgram} addCustomExo={addCustomExo} deleteCustomExo={deleteCustomExo} customSplits={customSplits} addCustomSplit={addCustomSplit} deleteCustomSplit={deleteCustomSplit} programSplitIds={programSplits(profile)} />

      {/* Composition libre d'une journée : autant de blocs que voulu */}

        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ fontSize: 13, color: C.sub, lineHeight: 1.5 }}>Compose ta journée librement : tu peux placer plusieurs blocs le même jour (par exemple salle + cardio). Touche un bloc pour l'ajouter ou le retirer.</div>

          {/* Quota restant, mis à jour en direct */}
          <div style={{ display: "flex", gap: 8 }}>
            {[["Salle", quota.muscu, quota.goalM], ["Cardio", quota.cardio, quota.goalC]].map(([l, val, goal]) => {
              const reste = goal - val;
              return (
                <div key={l} style={{ flex: 1, background: C.card2, borderRadius: 12, padding: "10px 12px", textAlign: "center" }}>
                  <div style={{ fontSize: 11.5, fontWeight: 800, color: C.sub }}>{l}</div>
                  <div style={{ fontSize: 15, fontWeight: 800, marginTop: 3, color: reste === 0 ? C.good : reste < 0 ? C.fat : C.text }}>
                    {reste > 0 ? `${reste} à placer` : reste === 0 ? "quota atteint" : `${-reste} en trop`}
                  </div>
                </div>
              );
            })}
          </div>

          {(() => {
            const list = editDay ? plannedList(editDay, plan, week) : [];
            const setList = (next) => setPlan({ ...(plan || {}), [editDay]: next });
            return (
              <>
                <div>
                  <Label style={{ marginBottom: 8 }}>Blocs de la journée</Label>
                  {list.length === 0 ? (
                    <div style={{ background: C.card2, borderRadius: 13, padding: 14, fontSize: 13.5, color: C.faint, textAlign: "center" }}>Journée de repos</div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
                      {list.map((s, k) => {
                        const sp = SPLITS[s] || { label: s, color: C.sub, desc: "" };
                        return (
                          <div key={k} style={{ display: "flex", alignItems: "center", gap: 11, padding: "12px 13px", background: sp.color + "1A", borderRadius: 14, border: `1px solid ${sp.color}55` }}>
                            <Icon d={s === "cardio" ? IC.run : IC.dumbbell} size={18} color={sp.color} />
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontWeight: 800, fontSize: 14.5 }}>{sp.label}</div>
                              <div style={{ fontSize: 11.5, color: C.sub, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sp.desc}</div>
                            </div>
                            <button onClick={() => setList(list.filter((_, x) => x !== k))} style={{ background: "none", border: "none", color: C.faint, cursor: "pointer", padding: 5 }}><Icon d={IC.x} size={16} /></button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                <div>
                  <Label style={{ marginBottom: 8 }}>Ajouter un bloc</Label>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 9 }}>
                    {allSplitIds.map((s) => {
                      const sp = SPLITS[s];
                      return (
                        <button key={s} onClick={() => setList([...list, s])} style={{ display: "flex", alignItems: "center", gap: 9, padding: "13px 12px", borderRadius: 15, cursor: "pointer", fontFamily: FONT, textAlign: "left", border: `1.5px solid ${C.line}`, background: C.card2 }}>
                          <Icon d={s === "cardio" ? IC.run : IC.dumbbell} size={18} color={sp.color} />
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontWeight: 800, fontSize: 14, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sp.label}</div>
                            <div style={{ fontSize: 11, color: C.faint }}>+ ajouter</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Séances réellement enregistrées ce jour-là */}
                {(() => {
                  const faites = workouts.filter((w) => w.date === editDay);
                  if (!faites.length) return null;
                  return (
                    <div>
                      <Label style={{ marginBottom: 8 }}>Séances enregistrées ce jour</Label>
                      <div style={{ display: "flex", flexDirection: "column", gap: 7 }}>
                        {faites.map((w) => {
                          const estCardio = w.type === "cardio";
                          const ct = estCardio ? cardioType(w.cardioType) : null;
                          const sp = estCardio ? SPLITS.cardio : SPLITS[w.split] || { label: w.split, color: C.sub };
                          return (
                            <button key={w.id} onClick={() => { if (!estCardio) { setEditWorkout(w); setEditDay(null); } }} style={{ display: "flex", alignItems: "center", gap: 11, padding: "12px 13px", background: C.card2, borderRadius: 14, border: `1px solid ${C.line}`, cursor: estCardio ? "default" : "pointer", fontFamily: FONT, textAlign: "left", width: "100%" }}>
                              <Icon d={estCardio ? IC[ct.icon || "run"] : IC.dumbbell} size={17} color={sp.color} />
                              <div style={{ flex: 1, minWidth: 0 }}>
                                <div style={{ fontWeight: 700, fontSize: 14 }}>{estCardio ? ct.label : sp.label}</div>
                                <div style={{ fontSize: 11.5, color: C.faint }}>{w.duree} min · {w.kcal} kcal{!estCardio && w.exos ? ` · ${w.exos.length} exos` : ""}</div>
                              </div>
                              {estCardio
                                ? <span onClick={(e) => { e.stopPropagation(); onDeleteWorkout(w.id); }} style={{ color: C.faint, padding: 4 }}><Icon d={IC.trash} size={15} /></span>
                                : <span style={{ display: "flex", alignItems: "center", gap: 5, color: C.accent, fontWeight: 700, fontSize: 12.5 }}><Icon d={IC.edit} size={13} /> Modifier</span>}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                <div style={{ display: "flex", gap: 10 }}>
                  <Btn kind="ghost" onClick={() => setList([])}>Jour de repos</Btn>
                  {plan && editDay && plan[editDay] !== undefined && (
                    <Btn kind="ghost" onClick={() => { const p = { ...plan }; delete p[editDay]; setPlan(p); }}>Semaine type</Btn>
                  )}
                </div>
                <Btn onClick={() => setEditDay(null)}>Terminé</Btn>
              </>
            );
          })()}
        </div>
      </Sheet>
    </div>
  );
}

const BODY_METRICS = [
  { id: "kg", label: "Poids", unit: "kg", color: null },
  { id: "bf", label: "Masse grasse", unit: "%", color: "#FFB84D" },
  { id: "water", label: "Eau", unit: "%", color: "#4C9EFF" },
  { id: "muscle", label: "Muscle", unit: "kg", color: "#2FBF77" },
];

function BodyChart({ entries, metric, goal }) {
  const W = 320, H = 168, PAD = { l: 34, r: 14, t: 16, b: 30 };
  const m = BODY_METRICS.find((x) => x.id === metric);
  const color = m.color || C.accent;
  const pts = entries.filter((e) => e[metric] != null && e[metric] !== "").sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length === 0) return <div style={{ textAlign: "center", color: C.faint, fontSize: 13, padding: "26px 0" }}>Aucune donnée « {m.label} » — ajoute-la lors de ta prochaine pesée.</div>;
  const xs = pts.map((p) => parseKey(p.date).getTime());
  const ys = pts.map((p) => +p[metric]);
  const showGoal = metric === "kg" && goal != null;
  const minX = Math.min(...xs), maxX = Math.max(...xs, minX + 86400000 * 3);
  const minY = Math.min(...ys, showGoal ? goal : Infinity) - 1;
  const maxY = Math.max(...ys, showGoal ? goal : -Infinity) + 1;
  const X = (t) => PAD.l + ((t - minX) / (maxX - minX)) * (W - PAD.l - PAD.r);
  const Y = (v) => PAD.t + (1 - (v - minY) / (maxY - minY)) * (H - PAD.t - PAD.b);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(parseKey(p.date).getTime()).toFixed(1)},${Y(+p[metric]).toFixed(1)}`).join(" ");
  const area = `${path} L${X(xs[xs.length - 1]).toFixed(1)},${H - PAD.b} L${X(xs[0]).toFixed(1)},${H - PAD.b} Z`;
  const gridY = [minY + 0.5, (minY + maxY) / 2, maxY - 0.5];
  // labels de date : tous si <= 7 points, sinon échantillonnés
  const step = pts.length <= 7 ? 1 : Math.ceil(pts.length / 6);
  const labelIdx = pts.map((_, i) => i).filter((i) => i % step === 0 || i === pts.length - 1);
  const dm = (k) => { const d = parseKey(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
      {gridY.map((v, i) => (
        <g key={i}>
          <line x1={PAD.l} x2={W - PAD.r} y1={Y(v)} y2={Y(v)} stroke={C.grid} />
          <text x={PAD.l - 6} y={Y(v) + 3.5} textAnchor="end" fill={C.faint} fontSize="9.5" fontFamily={FONT} fontWeight="600">{r1(v)}</text>
        </g>
      ))}
      {showGoal && (
        <g>
          <line x1={PAD.l} x2={W - PAD.r} y1={Y(goal)} y2={Y(goal)} stroke={C.good} strokeWidth="1.4" strokeDasharray="5 4" opacity="0.8" />
          <text x={W - PAD.r} y={Y(goal) - 5} textAnchor="end" fill={C.good} fontSize="9.5" fontWeight="800" fontFamily={FONT}>OBJECTIF {goal} KG</text>
        </g>
      )}
      <defs>
        <linearGradient id={`bArea-${metric}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.26" /><stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#bArea-${metric})`} />
      <path d={path} fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => {
        const x = X(parseKey(p.date).getTime()), y = Y(+p[metric]);
        const isLast = i === pts.length - 1;
        return (
          <g key={i}>
            <circle cx={x} cy={y} r={isLast ? 4.5 : 3} fill={isLast ? color : C.card} stroke={color} strokeWidth="1.8" />
            {isLast && <text x={x} y={y - 9} textAnchor="middle" fill={color} fontSize="10.5" fontWeight="800" fontFamily={FONT}>{r1(+p[metric])}{m.unit === "%" ? "%" : ""}</text>}
          </g>
        );
      })}
      {labelIdx.map((i) => (
        <text key={i} x={X(parseKey(pts[i].date).getTime())} y={H - 8} textAnchor="middle" fill={C.faint} fontSize="9" fontFamily={FONT} fontWeight="700">{dm(pts[i].date)}</text>
      ))}
    </svg>
  );
}

function WeighSheet({ open, onClose, onSave, lastEntry }) {
  const [f, setF] = useState({ kg: "", bf: "", water: "", muscle: "", date: dateKey() });
  useEffect(() => { if (open) setF({ kg: "", bf: "", water: "", muscle: "", date: dateKey() }); }, [open]);
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));
  return (
    <Sheet open={open} onClose={onClose} title="Nouvelle pesée">
      <div style={{ display: "flex", flexDirection: "column", gap: 15 }}>
        <div>
          <Label style={{ marginBottom: 7 }}>Date de la pesée</Label>
          <div style={{ display: "flex", alignItems: "center", background: C.card2, border: `1px solid ${C.line}`, borderRadius: 14, padding: "0 14px" }}>
            <input type="date" value={f.date} max={dateKey()} onChange={(e) => set("date", e.target.value)} style={{ background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 15, fontWeight: 600, fontFamily: FONT, padding: "13px 0", width: "100%", colorScheme: C.mode }} />
          </div>
        </div>
        <Field label="Poids" value={f.kg} onChange={(v) => set("kg", v)} suffix="kg" placeholder={lastEntry ? String(lastEntry.kg) : "75"} />
        <Label>Composition corporelle <span style={{ color: C.faint, textTransform: "none", letterSpacing: 0 }}>(optionnel — balance impédancemètre)</span></Label>
        <div style={{ display: "flex", gap: 10 }}>
          <Field label="Masse grasse" value={f.bf} onChange={(v) => set("bf", v)} suffix="%" />
          <Field label="Eau" value={f.water} onChange={(v) => set("water", v)} suffix="%" />
        </div>
        <Field label="Masse musculaire" value={f.muscle} onChange={(v) => set("muscle", v)} suffix="kg" />
        <Btn disabled={!+f.kg} onClick={() => {
          onSave({ kg: +(+f.kg).toFixed(1), bf: f.bf !== "" ? +(+f.bf).toFixed(1) : null, water: f.water !== "" ? +(+f.water).toFixed(1) : null, muscle: f.muscle !== "" ? +(+f.muscle).toFixed(1) : null, date: f.date });
          onClose();
        }}>Enregistrer</Btn>
      </div>
    </Sheet>
  );
}

const MEASURE_FIELDS = [["waist", "Tour de taille"], ["chest", "Poitrine"], ["arm", "Bras"], ["thigh", "Cuisse"], ["hips", "Hanches"]];

function MeasureChart({ measures, field }) {
  const W = 320, H = 150, PAD = { l: 34, r: 14, t: 16, b: 26 };
  const pts = measures.filter((e) => e[field] != null && e[field] !== "").sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 2) return <div style={{ textAlign: "center", color: C.faint, fontSize: 13, padding: "22px 0" }}>Ajoute au moins 2 mesures pour voir la courbe.</div>;
  const color = C.accent;
  const xs = pts.map((p) => parseKey(p.date).getTime());
  const ys = pts.map((p) => +p[field]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys) - 1, maxY = Math.max(...ys) + 1;
  const X = (t) => PAD.l + ((t - minX) / (maxX - minX)) * (W - PAD.l - PAD.r);
  const Y = (v) => PAD.t + (1 - (v - minY) / (maxY - minY)) * (H - PAD.t - PAD.b);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(parseKey(p.date).getTime()).toFixed(1)},${Y(+p[field]).toFixed(1)}`).join(" ");
  const area = `${path} L${X(xs[xs.length - 1]).toFixed(1)},${H - PAD.b} L${X(xs[0]).toFixed(1)},${H - PAD.b} Z`;
  const gridY = [minY + 0.5, (minY + maxY) / 2, maxY - 0.5];
  const step = pts.length <= 6 ? 1 : Math.ceil(pts.length / 5);
  const labelIdx = pts.map((_, i) => i).filter((i) => i % step === 0 || i === pts.length - 1);
  const dm = (k) => { const d = parseKey(k); return `${d.getDate()}/${d.getMonth() + 1}`; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
      {gridY.map((v, i) => (
        <g key={i}>
          <line x1={PAD.l} x2={W - PAD.r} y1={Y(v)} y2={Y(v)} stroke={C.grid} />
          <text x={PAD.l - 6} y={Y(v) + 3.5} textAnchor="end" fill={C.faint} fontSize="9.5" fontFamily={FONT} fontWeight="600">{r1(v)}</text>
        </g>
      ))}
      <defs>
        <linearGradient id={`mArea-${field}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.24" /><stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#mArea-${field})`} />
      <path d={path} fill="none" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => {
        const x = X(parseKey(p.date).getTime()), y = Y(+p[field]);
        const isLast = i === pts.length - 1;
        return (
          <g key={i}>
            <circle cx={x} cy={y} r={isLast ? 4.5 : 3} fill={isLast ? color : C.card} stroke={color} strokeWidth="1.8" />
            {isLast && <text x={x} y={y - 9} textAnchor="middle" fill={color} fontSize="10.5" fontWeight="800" fontFamily={FONT}>{r1(+p[field])}</text>}
          </g>
        );
      })}
      {labelIdx.map((i) => (
        <text key={i} x={X(parseKey(pts[i].date).getTime())} y={H - 7} textAnchor="middle" fill={C.faint} fontSize="9" fontFamily={FONT} fontWeight="700">{dm(pts[i].date)}</text>
      ))}
    </svg>
  );
}

const BACKUP_KEYS = ["profile", "nutrition", "workouts", "weights", "foods", "theme", "water", "measures", "photos", "customExos", "favMeals", "favorites"];

function exportJSON(state) {
  const payload = { app: "forge", version: 1, exportedAt: new Date().toISOString(), data: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `forge-sauvegarde-${dateKey()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importJSONFile(file) {
  const text = await file.text();
  const parsed = JSON.parse(text);
  if (!parsed || parsed.app !== "forge" || !parsed.data) throw new Error("format invalide");
  return parsed.data;
}

/* ---------------- Rappels (notifications navigateur) ----------------
   Planification côté client : tant que l'onglet reste ouvert (ou l'app installée
   en arrière-plan sur mobile), un timer déclenche une notification à l'heure prévue.
   Limite connue du HTML statique : si l'onglet est complètement fermé, les rappels
   ne se déclenchent pas — c'est la contrainte d'une app sans serveur de push. */
const REMINDER_DEFS = [
  { id: "pdj", label: "Petit-déjeuner", defaultTime: "08:00", body: "N'oublie pas de logger ton petit-déjeuner." },
  { id: "dej", label: "Déjeuner", defaultTime: "12:30", body: "C'est l'heure du déjeuner — pense à le noter." },
  { id: "din", label: "Dîner", defaultTime: "19:30", body: "Note ton dîner dans le journal." },
  { id: "water", label: "Hydratation", defaultTime: "15:00", body: "Pense à boire de l'eau." },
  { id: "weigh", label: "Pesée", defaultTime: "07:30", body: "Pèse-toi et enregistre ta progression.", weekly: true },
];

let reminderTimers = [];
function clearReminderTimers() { reminderTimers.forEach((t) => clearTimeout(t)); reminderTimers = []; }

function scheduleReminders(reminders) {
  clearReminderTimers();
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  REMINDER_DEFS.forEach((def) => {
    const r = reminders[def.id];
    if (!r || !r.on) return;
    const [h, m] = (r.time || def.defaultTime).split(":").map(Number);
    const now = new Date();
    const next = new Date();
    next.setHours(h, m, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    const delay = next - now;
    if (delay > 0 && delay < 2147483647) {
      reminderTimers.push(setTimeout(function fire() {
        try { new Notification("Forge — " + def.label, { body: def.body }); } catch (e) {}
        // reprogramme pour le lendemain
        reminderTimers.push(setTimeout(fire, 86400000));
      }, delay));
    }
  });
}

function exportCSV({ weights, measures, workouts, nutrition }) {
  const L = [];
  L.push("PESEES"); L.push("date;kg;masse_grasse_pct;eau_pct;muscle_kg;appetit_1_5;prise;dose_mg;note");
  [...weights].sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((w) => L.push([w.date, w.kg, w.bf ?? "", w.water ?? "", w.muscle ?? "", w.appetit ?? "", w.dose ? "oui" : "", w.mg ?? "", (w.note || "").replace(/[;\n]/g, ",")].join(";")));
  L.push(""); L.push("MENSURATIONS"); L.push("date;taille_cm;poitrine_cm;bras_cm;cuisse_cm;hanches_cm");
  measures.forEach((m) => L.push([m.date, m.waist ?? "", m.chest ?? "", m.arm ?? "", m.thigh ?? "", m.hips ?? ""].join(";")));
  L.push(""); L.push("SEANCES"); L.push("date;type;seance;duree_min;volume_kg;kcal");
  [...workouts].sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((w) => L.push([w.date, w.type, w.split || w.cardioType || "", w.duree, w.volume ?? "", w.kcal].join(";")));
  L.push(""); L.push("NUTRITION"); L.push("date;repas;aliment;grammes;kcal;proteines_g;glucides_g;lipides_g");
  Object.keys(nutrition).sort().forEach((d) => (nutrition[d] || []).forEach((e) => L.push([d, e.meal, e.name.replace(/;/g, ","), e.grams, Math.round((e.per100.k * e.grams) / 100), r1((e.per100.p * e.grams) / 100), r1((e.per100.g * e.grams) / 100), r1((e.per100.l * e.grams) / 100)].join(";"))));
  const blob = new Blob(["\ufeff" + L.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `forge-export-${dateKey()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
