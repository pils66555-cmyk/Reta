/* ---------------- Thèmes & personnalisation ---------------- */
const ACCENTS = [
  { id: "orange", label: "Orange", hex: "#FC5200", light: "#FF8A3D" },
  { id: "blue", label: "Bleu", hex: "#3D8BFF", light: "#74AFFF" },
  { id: "green", label: "Vert", hex: "#22B96A", light: "#54D890" },

  { id: "rose", label: "Rose", hex: "#F23F77", light: "#FA7AA4" },
  { id: "cyan", label: "Cyan", hex: "#0AA9C2", light: "#4FCFE0" },
  { id: "loufoque", label: "Loufoque", hex: "#E5006D", light: "#A855F7", fun: true },
  { id: "hacker", label: "Hacker", hex: "#39FF14", light: "#39FF14", hacker: true },
];
/* Palette Loufoque — deux jeux de teintes, car une couleur lisible sur fond sombre
   ne l'est pas forcément sur fond clair (et inversement). Chaque teinte a été
   vérifiée : ≥ 3:1 pour les icônes/remplissages, ≥ 4.5:1 pour l'accent employé
   comme texte (normes WCAG). Les textes courants gardent C.text / C.sub :
   c'est ce qui garde tout lisible malgré le côté multicolore. */
const FUN = {
  light: {
    accent: "#C2005C",
    palette: ["#C2005C", "#B4530A", "#15803D", "#1D5FD8", "#6D28D9", "#0E7490"],
    cardBg: ["#FFD6E8", "#FFDFB0", "#C9F2D6", "#C9E0FF", "#E3D3FF", "#C3F3F3"],
    bodyBg: "linear-gradient(135deg,#FFE3EE 0%,#FFF0D9 25%,#DFF7E6 50%,#DCEBFF 75%,#EFE0FF 100%)",
    navBg: "rgba(255,255,255,0.75)",
    line: "rgba(20,20,30,0.14)",
  },
  dark: {
    accent: "#FF5C9E",
    palette: ["#FF5C9E", "#FB923C", "#4ADE80", "#60A5FA", "#C084FC", "#22D3EE"],
    cardBg: ["#4A0F2C", "#4A2A08", "#0F3D26", "#0F2E5C", "#341466", "#053E44"],
    bodyBg: "linear-gradient(135deg,#2A0A18 0%,#2E1B06 25%,#08251A 50%,#081B3A 75%,#1E0C3E 100%)",
    navBg: "rgba(13,13,17,0.75)",
    line: "rgba(255,255,255,0.16)",
  },
};
const MODES = {
  dark: {
    bg: "#000000", card: "rgba(28,28,32,0.58)", card2: "rgba(118,118,128,0.24)", line: "rgba(255,255,255,0.10)",
    text: "#F5F5F7", sub: "#AEAEB2", faint: "#8E8E93", track: "rgba(118,118,128,0.30)",
    muscle: "#2C2C30", muscleStroke: "rgba(255,255,255,0.16)", disabled: "rgba(118,118,128,0.36)",
    navBg: "rgba(30,30,34,0.55)", grid: "rgba(255,255,255,0.06)", overlay: "rgba(0,0,0,0.45)",
    glassBorder: "rgba(255,255,255,0.14)", glassShadow: "0 10px 30px rgba(0,0,0,0.45)", spec: 0.10,
  },
  light: {
    bg: "#EDF0F6", card: "rgba(255,255,255,0.62)", card2: "rgba(118,118,128,0.10)", line: "rgba(60,60,67,0.12)",
    text: "#1C1C1E", sub: "#636366", faint: "#8E8E93", track: "rgba(118,118,128,0.16)",
    muscle: "#D8DCE6", muscleStroke: "rgba(60,60,67,0.22)", disabled: "rgba(118,118,128,0.22)",
    navBg: "rgba(255,255,255,0.58)", grid: "rgba(60,60,67,0.08)", overlay: "rgba(20,24,40,0.28)",
    glassBorder: "rgba(255,255,255,0.75)", glassShadow: "0 10px 30px rgba(40,50,90,0.10)", spec: 0.55,
  },
};
const hexA = (hex, a) => hex + Math.round(a * 255).toString(16).padStart(2, "0");
/* Couleurs sémantiques alignées sur les couleurs système iOS */
const C = { prot: "#FF375F", carb: "#0A84FF", fat: "#FF9F0A", good: "#34C759", bad: "#FF3B30" };
function applyTheme(mode, accentId) {
  const forcedMode = accentId === "hacker" ? "dark" : mode;
  const m = MODES[forcedMode] || MODES.dark;
  const a = ACCENTS.find((x) => x.id === accentId) || ACCENTS[0];
  const fun = a.fun ? FUN[forcedMode] || FUN.dark : null;
  const hacker = !!a.hacker;
  const accent = fun ? fun.accent : a.hex;
  Object.assign(C, m, {
    accent, accentLight: fun ? fun.palette[4] : a.light, accentSoft: hexA(accent, 0.14), accentGlow: hexA(accent, 0.35), mode: forcedMode,
    fun: !!fun, hacker,
    palette: fun ? fun.palette : [accent],
    stops: fun ? fun.palette : [a.light, a.hex],
  });
  if (fun) {
    Object.assign(C, {
      bg: fun.bodyBg, cardBg: fun.cardBg, navBg: fun.navBg, line: fun.line,
      card2: forcedMode === "light" ? "rgba(255,255,255,0.55)" : "rgba(255,255,255,0.10)",
      track: forcedMode === "light" ? "rgba(20,20,30,0.14)" : "rgba(255,255,255,0.16)",
    });
  } else {
    C.cardBg = null;
  }
  if (hacker) {
    Object.assign(C, {
      bg: "#000000", card: "#050805", card2: "#0B120B", line: "rgba(57,255,20,0.28)",
      track: "rgba(57,255,20,0.14)", navBg: "rgba(0,0,0,0.82)", text: "#D9FFD0", sub: "#39FF14", faint: "#1F8A0E",
      glow: "0 0 8px rgba(57,255,20,0.85), 0 0 18px rgba(57,255,20,0.35)",
      glassBorder: "rgba(57,255,20,0.30)", glassShadow: "0 0 24px rgba(57,255,20,0.08)", spec: 0,
    });
  } else {
    C.glow = "none";
  }
  if (typeof document !== "undefined") {
    document.body.style.background = C.mode === "dark" ? "#000" : MODES.light.bg;
    document.body.style.colorScheme = C.mode;
    // variables lues par la classe .lg (verre liquide) définie dans la feuille de style globale
    const root = document.documentElement;
    if (root && root.style && root.style.setProperty) {
      root.style.setProperty("--glass", C.card);
      root.style.setProperty("--glass-border", C.glassBorder);
      root.style.setProperty("--glass-shadow", C.glassShadow);
      root.style.setProperty("--spec", String(C.spec));
    }

}
/* Couleur cyclique : en mode Loufoque chaque élément d'une liste prend sa propre
   teinte ; sinon tout reste sur la couleur d'accent choisie. */
const funColor = (i) => C.palette[i % C.palette.length];
const gradCSS = (angle) => `linear-gradient(${angle}, ${C.stops.join(", ")})`;
/* Fond de carte cyclique en mode Loufoque : chaque <Card> qui n'impose pas déjà
   son propre fond prend la couleur suivante de la palette, dans l'ordre d'affichage. */
let cardColorTicker = 0;
const nextCardBg = () => { const bg = C.cardBg ? C.cardBg[cardColorTicker % C.cardBg.length] : C.card; cardColorTicker++; return bg; };

/* ---------------- Calculs métaboliques ---------------- */
const ACTIVITES = [
  { id: "sedentaire", label: "Sédentaire", desc: "Bureau, peu de marche", f: 1.2 },
  { id: "leger", label: "Légèrement actif", desc: "Marche quotidienne", f: 1.375 },
  { id: "modere", label: "Modérément actif", desc: "Debout / actif au travail", f: 1.55 },
  { id: "actif", label: "Très actif", desc: "Travail physique", f: 1.725 },
];

function calcBMR(p) {
  const base = 10 * p.poids + 6.25 * p.taille - 5 * p.age;
  return p.sexe === "H" ? base + 5 : base - 161;
}

/* ---------------- Calcul du plan calorique ----------------
   Améliorations par rapport à une simple formule Mifflin :
   1. Si le % de masse grasse est connu, on utilise Katch-McArdle (basé sur la masse
      maigre), plus fiable qu'une formule au poids total quand le poids est élevé.
   2. Le déficit est plafonné à 25 % de la dépense ET à 1 % du poids par semaine :
      au-delà, la perte vient surtout du muscle et devient intenable.
   3. Plancher de sécurité : jamais sous le métabolisme de base, ni sous 1500/1200 kcal.
   4. Protéines calculées sur la masse maigre (ou le poids cible), pas sur le poids
      total — sinon on obtient des quantités inutilement énormes en surpoids.
   5. Lipides jamais sous 0,8 g/kg de poids cible (équilibre hormonal).
   Les calories brûlées à l'entraînement sont ajoutées au budget du jour séparément :
   le facteur d'activité ne couvre donc QUE la vie courante, sans le sport. */
function calcPlan(p, bodyFat) {
  const act = ACTIVITES.find((a) => a.id === p.activite) || ACTIVITES[1];
  const bf = bodyFat != null && bodyFat > 3 && bodyFat < 70 ? bodyFat : null;
  const lbm = bf ? p.poids * (1 - bf / 100) : null;
  const bmr = lbm ? 370 + 21.6 * lbm : calcBMR(p);
  const tdee = Math.round(bmr * act.f);

  const days = Math.max(14, Math.round((parseKey(p.dateCible) - new Date()) / 86400000));
  const deltaKg = p.poids - p.poidsCible; // > 0 = perte visée
  const perte = deltaKg > 0;

  // Rythme demandé par l'échéance, puis bridé par les limites de sécurité
  const rythmeDemande = Math.abs(deltaKg) / (days / 7); // kg par semaine
  const rythmeMaxPoids = p.poids * 0.01; // 1 % du poids par semaine
  const deficitMax = tdee * 0.25;
  const rythmeMaxDeficit = (deficitMax * 7) / 7700;
  const surplusMax = 0.4; // prise de masse : au-delà, c'est surtout du gras
  // Mode strict : on suit l'échéance demandée, sans plafonner le rythme.
  const strict = !!p.objectifStrict;
  const rythme = strict
    ? rythmeDemande
    : perte
      ? Math.min(rythmeDemande, rythmeMaxPoids, rythmeMaxDeficit)
      : Math.min(rythmeDemande, surplusMax);

  const ajustement = (rythme * 7700) / 7; // kcal/jour
  let cal = Math.round(perte ? tdee - ajustement : tdee + ajustement);

  // Plancher : en mode normal on ne descend pas sous le métabolisme de base.
  // En mode strict, seul un minimum absolu subsiste (sous ce seuil, les calculs
  // n'ont plus de sens physiologique et l'apport en micronutriments s'effondre).
  const minSexe = p.sexe === "H" ? 1500 : 1200;
  const plancher = strict ? 1200 : Math.max(Math.round(bmr), minSexe);
  let warning = null;
  if (!strict && perte && rythmeDemande > rythme + 0.02) warning = "trop_rapide";
  if (cal < plancher) { cal = plancher; warning = "plancher"; }
  if (strict && perte && rythme > p.poids * 0.01) warning = warning || "rythme_eleve";

  // Durée réaliste pour atteindre l'objectif au rythme retenu
  const semainesReelles = rythme > 0 ? Math.ceil(Math.abs(deltaKg) / rythme) : 0;
  const dateReelle = new Date();
  dateReelle.setDate(dateReelle.getDate() + semainesReelles * 7);

  // --- Répartition des macros ---
  // Lipides : ~27 % des calories, borné entre 0,6 g/kg de poids cible et 35 % des calories.
  const fat = Math.round(clamp((cal * 0.27) / 9, p.poidsCible * 0.6, (cal * 0.35) / 9));
  // Protéines : sur la masse maigre si connue, sinon sur le poids cible.
  // Sur un budget serré, elles sont réduites pour laisser au moins 12 % de glucides :
  // sans ce garde-fou, la somme des macros dépasserait les calories disponibles.
  const basePro = lbm || Math.min(p.poids, p.poidsCible + 10);
  const protVoulu = basePro * (perte ? 2.2 : 2.0);
  const protMax = (cal - fat * 9 - cal * 0.12) / 4;
  const prot = Math.round(clamp(Math.min(protVoulu, protMax), 90, 260));
  const carb = Math.max(0, Math.round((cal - prot * 4 - fat * 9) / 4));

  return {
    strict, bmr: Math.round(bmr), tdee, cal, prot, carb, fat, days,
    weeklyRate: r1(perte ? -rythme : rythme),
    deltaKg: r1(deltaKg), warning,
    methode: lbm ? "Katch-McArdle (masse maigre)" : "Mifflin-St Jeor",
    semainesReelles, dateReelle: dateKey(dateReelle),
    deficit: Math.round(Math.abs(tdee - cal)),
  };
}

/* ---------------- Unités de saisie ----------------
   Les valeurs nutritionnelles sont toujours stockées pour 100 g, mais on saisit
   dans l'unité qui a du sens : des cl pour une boisson, une unité pour un œuf
   ou une brique. La conversion se fait à la volée. */
const LIQUIDE_RE = /boisson|lait|jus|soda|bière|biere|vin|smoothie|crème liquide|creme liquide|sirop|eau/i;
const estLiquide = (f) => !!(f && (f.liquide || LIQUIDE_RE.test(f.name || "")));
/* Densité approximative : 1 ml ≈ 1 g pour la plupart des boissons, un peu plus
   pour les laitages et les jus sucrés. */
const densite = (f) => f.densite || (/lait|crème|creme|yaourt|jus/i.test(f.name || "") ? 1.03 : 1);
const UNITES = {
  g: { label: "g", court: "g", enG: (q, f) => q },
  ml: { label: "ml", court: "ml", enG: (q, f) => q * densite(f) },
  cl: { label: "cl", court: "cl", enG: (q, f) => q * 10 * densite(f) },
  u: { label: "unité", court: "u", enG: (q, f) => q * ((f.unite && f.unite.grams) || 100) },
};
/* Unités proposées pour un aliment donné, dans l'ordre de pertinence */
function unitesPour(f) {
  const l = [];
  if (estLiquide(f)) l.push("cl", "ml");
  if (f && f.unite && f.unite.grams) l.push("u");
  l.push("g");
  return l;
}
const enGrammes = (qty, unit, food) => Math.round(((UNITES[unit] || UNITES.g).enG(+qty || 0, food)) * 10) / 10;
/* Quantités rapides adaptées à l'unité */
const raccourcis = (unit, food) => {
  if (unit === "cl") return [10, 20, 25, 33];
  if (unit === "ml") return [100, 200, 250, 330];
  if (unit === "u") return [1, 2, 3, 4];
  return [50, 100, 150, 200];
};
/* Libellé d'une quantité dans le journal */
const libelleQte = (e) => {
  if (e.unit && e.unit !== "g" && e.qty) {
    const u = UNITES[e.unit] || UNITES.g;
    return e.unit === "u" ? `${r1(e.qty)} ${e.qty > 1 ? "unités" : "unité"} (${Math.round(e.grams)} g)` : `${r1(e.qty)} ${u.court}`;
  }
  return `${Math.round(e.grams)} g`;
};

const MEALS = [
  { id: "pdj", label: "Petit-déjeuner", icon: "sun" },
  { id: "dej", label: "Déjeuner", icon: "food" },
  { id: "gout", label: "Goûter", icon: "apple" },
  { id: "din", label: "Dîner", icon: "moon" },
];
/* Répartition des calories du jour par repas (pour l'ajustement des recettes) */
const MEAL_SPLIT = { pdj: 0.25, dej: 0.35, gout: 0.1, din: 0.3 };
/* Repas réellement pris dans la journée — configurable, car tout le monde
   ne petit-déjeune pas. Les parts sont renormalisées sur les repas actifs. */
const REPAS_DEFAUT = ["pdj", "dej", "gout", "din"];
const repasActifs = (profile) => {
  const r = (profile && profile.repas) || REPAS_DEFAUT;
  return MEALS.filter((m) => r.includes(m.id));
};
const partRepas = (mealId, profile) => {
  const actifs = repasActifs(profile);
  const total = actifs.reduce((s, m) => s + MEAL_SPLIT[m.id], 0) || 1;
  return actifs.some((m) => m.id === mealId) ? MEAL_SPLIT[mealId] / total : 0;
};

/* Un profil vegan ne voit que les recettes végétales ; un omnivore voit tout. */
const RECETTE_OK = { omnivore: () => true, vegetarien: (r) => r.regime !== "omnivore", vegan: (r) => r.regime === "vegan" };

/* Totaux d'une liste d'ingrédients résolus dans la base */
function totauxItems(items) {
  return items.reduce((s, it) => ({
    k: s.k + (it.food.k * it.grams) / 100, p: s.p + (it.food.p * it.grams) / 100,
    g: s.g + (it.food.g * it.grams) / 100, l: s.l + (it.food.l * it.grams) / 100,
  }), { k: 0, p: 0, g: 0, l: 0 });
}
/* Met la recette à l'échelle du budget calorique du repas.
   Le facteur est borné pour éviter des portions absurdes (0,6× à 2×). */
function recetteAjustee(recette, budgetKcal, foods) {
  const items = recette.items
    .map(([nom, grams]) => ({ food: foods.find((f) => f.name === nom), grams }))
    .filter((it) => it.food);
  if (!items.length) return null;
  const base = totauxItems(items);
  const facteur = base.k > 0 ? clamp(budgetKcal / base.k, 0.6, 2) : 1;
  const ajustes = items.map((it) => ({ ...it, grams: Math.max(5, Math.round(it.grams * facteur)) }));
  return { ...recette, items: ajustes, totaux: totauxItems(ajustes), facteur };
}

const recettesPour = (mealId, regime) => {
  const ok = RECETTE_OK[regime] || RECETTE_OK.omnivore;
  return RECETTES.filter((r) => r.repas.includes(mealId) && ok(r));
};

/* Liste effective = base + activités créées par l'utilisateur.
   Mutation EN PLACE : le tableau doit garder la même référence, sinon les
   composants qui l'ont déjà capturé continueraient d'afficher l'ancienne liste. */
const CARDIO_TYPES = [...CARDIO_BASE];
function registerCardio(custom) {
  CARDIO_TYPES.length = 0;
  CARDIO_TYPES.push(...CARDIO_BASE, ...(custom || []).map((c) => ({ ...c, custom: true })));
}
const cardioType = (id) => CARDIO_TYPES.find((c) => c.id === id) || CARDIO_BASE[0];
/* MET effectif d'une séance cardio, en tenant compte de la variante choisie */
function cardioMet(typeId, subId) {
  const t = cardioType(typeId);
  if (subId && t.subs) { const s = t.subs.find((x) => x.id === subId); if (s) return s.met; }
  return t.met;
}
const kcalCardio = (met, poids, min) => Math.round((met * poids * min) / 60);

/* Activités où la pente change réellement le coût énergétique */
const CARDIO_PENTE = { course: "inclinaison", marche: "inclinaison", elliptique: "inclinaison", velo: "denivele", randonnee: "denivele", course_nature: "denivele" };
/* L'inclinaison d'un tapis augmente fortement la dépense (≈ +8 % de MET par point de pente,
   approximation des équations ACSM). Plafonné à 15 % pour rester réaliste. */
const metAvecPente = (met, inclinaison) => met * (1 + clamp(+inclinaison || 0, 0, 15) * 0.08);
/* Coût du dénivelé positif : travail contre la gravité, corrigé du rendement musculaire
   (≈ 0,0078 kcal par kg et par mètre de montée). */
const kcalDenivele = (poids, metres) => Math.round(poids * Math.max(0, +metres || 0) * 0.0078);

/* Calories totales d'une séance cardio, pente comprise */
function kcalCardioTotal({ met, poids, min, inclinaison, denivele }) {
  return kcalCardio(metAvecPente(met, inclinaison), poids, min) + kcalDenivele(poids, denivele);
}

/* Estimation calorique d'une séance de muscu, basée sur le TRAVAIL RÉEL effectué
   (nombre de séries loggées) plutôt que sur la seule durée — une séance de 60 min
   avec 3 séries et une avec 20 séries ne dépensent pas la même énergie.
   Références MET (Compendium of Physical Activities) : muscu vigoureuse ≈ 6.0,
   muscu modérée ≈ 3.5-5.0. On pondère par groupe musculaire (jambes = masse
   musculaire plus grande = dépense plus élevée) et on sépare temps de travail / repos. */
const MUSCU_MET_WORK = { push: 5.0, pull: 5.3, legs: 6.3 };
const MUSCU_MET_REST = 2.3; // debout, récupération entre les séries
const SET_ACTIVE_SECONDS = 38; // temps sous tension moyen par série (montée+descente+installation)

function kcalMuscu(poids, dureeMin, split, totalSets) {
  const workMin = Math.min(dureeMin, (totalSets * SET_ACTIVE_SECONDS) / 60);
  const restMin = Math.max(0, dureeMin - workMin);
  const metWork = MUSCU_MET_WORK[split] || (SPLITS[split] && SPLITS[split].met) || 5.0;
  return kcalCardio(metWork, poids, workMin) + kcalCardio(MUSCU_MET_REST, poids, restMin);
}

const PRESET_SPLIT_IDS = ["pecs", "dos", "jambes", "bras"];
/* Programme actif : PPL (3 séances) ou Split 4 séances */
const PROGRAMMES = [
  { id: "split4", label: "4 séances", desc: "Pecs · Dos · Jambes · Bras", splits: PRESET_SPLIT_IDS },
  { id: "ppl", label: "PPL", desc: "Push · Pull · Legs", splits: ["push", "pull", "legs"] },
];
const programSplits = (profile) => (PROGRAMMES.find((p) => p.id === (profile && profile.programType)) || PROGRAMMES[0]).splits;
/* Exercices par défaut d'une séance preset, à partir de la bibliothèque */
const presetExoIds = (splitId, allExos) => (PRESET_EXOS[splitId] || []).map((n) => (allExos.find((e) => e.name === n) || {}).id).filter(Boolean);

const SPLIT_COLORS = ["#FC5200", "#4C9EFF", "#33D17A", "#A855F7", "#EC4899", "#14B8A6", "#F59E0B", "#6366F1"];
/* Séances créées par l'utilisateur (Bras & Épaules, Jambes avant…) : elles sont
   injectées dans SPLITS pour que tout l'affichage existant les reconnaisse. */
function registerSplits(customSplits) {
  Object.keys(SPLITS).forEach((k) => { if (SPLITS[k].custom) delete SPLITS[k]; });
  (customSplits || []).forEach((cs) => { SPLITS[cs.id] = { label: cs.label, desc: cs.desc || "Séance personnalisée", color: cs.color, met: cs.met, custom: true }; });
}
const isMuscuSplit = (id) => id !== "cardio" && id !== "repos" && !!SPLITS[id];
/* Exercices d'une séance : pour une séance personnalisée, la sélection fait foi
   (n'importe quel exercice, quel que soit son groupe d'origine). */
function exosForSplit(splitId, allExos, program) {
  const chosen = program && program[splitId];
  const sp = SPLITS[splitId];
  if (sp && (sp.custom || sp.preset)) {
    const ids = chosen || presetExoIds(splitId, allExos);
    return ids.map((id) => allExos.find((e) => e.id === id)).filter(Boolean);
  }
  const list = allExos.filter((e) => e.split === splitId);
  return chosen ? list.filter((e) => chosen.includes(e.id)) : list;
}

/* Placement des séances dans la semaine (index 0 = lundi) */
const MUSCU_SLOTS = { 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5] };
const PPL_CYCLE = ["push", "pull", "legs"];

function buildWeek(muscuDays, cardioDays, cycle) {
  const c = cycle && cycle.length ? cycle : PPL_CYCLE;
  const week = Array(7).fill("repos");
  const slots = MUSCU_SLOTS[clamp(muscuDays, 3, 6)] || MUSCU_SLOTS[3];
  slots.forEach((d, i) => { week[d] = c[i % c.length]; });
  let placed = 0;
  const cardioPref = [5, 6, 2, 3, 1, 4, 0];
  for (const d of cardioPref) {
    if (placed >= cardioDays) break;
    if (week[d] === "repos") { week[d] = "cardio"; placed++; }
  }
  return week;
}

/* ---------------- Multi-utilisateurs ----------------
   Chaque personne a ses propres objectifs, séances, journal, pesées…
   Les données de l'utilisateur 1 gardent les clés d'origine (aucune migration
   nécessaire) ; les suivants sont suffixés par leur id. */
/* Le second profil n'existe que si un prénom lui est donné : tant qu'il est vide,
   l'app reste mono-utilisateur et la barre de bascule n'apparaît pas. */
const DEFAULT_USERS = [
  { id: "u1", name: "", color: "#3D8BFF" },
  { id: "u2", name: "", color: "#F23F77" },
];
const namedUsers = (users) => (users || []).filter((u) => (u.name || "").trim());
const USER_COLORS = ["#3D8BFF", "#F23F77", "#22B96A", "#F59E0B"];
/* Clé de stockage propre à un utilisateur */
const uKey = (base, uid) => (uid === "u1" ? base : `${base}--${uid}`);

/* ---------------- Semaine planifiée + séance du jour ----------------
   `plan` est une carte date -> type de séance ("push" | "pull" | "legs" |
   "cardio" | "repos"), qui remplace ponctuellement la semaine type. */
const startOfWeek = (d = new Date()) => {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // lundi
  return x;
};
function weekDates(offset = 0) {
  const s = startOfWeek();
  s.setDate(s.getDate() + offset * 7);
  return Array.from({ length: 7 }, (_, i) => { const d = new Date(s); d.setDate(d.getDate() + i); return dateKey(d); });
}
/* Séances prévues pour une date. Le planning manuel prime sur la semaine type,
   et un même jour peut contenir PLUSIEURS blocs (ex. muscu le matin + cardio le soir).
   Tolère l'ancien format où la valeur était une simple chaîne. */
function plannedList(dateStr, plan, week) {
  const v = plan && plan[dateStr];
  if (v !== undefined) return Array.isArray(v) ? v.filter((s) => s !== "repos") : v === "repos" ? [] : [v];
  const d = parseKey(dateStr);
  const base = week[(d.getDay() + 6) % 7];
  return base === "repos" ? [] : [base];
}
/* Bloc principal d'une journée (pour les affichages compacts) */
const plannedFor = (dateStr, plan, week) => {
  const l = plannedList(dateStr, plan, week);
  return l.length ? l[0] : "repos";
};
/* Blocs placés dans la semaine face au quota du profil */
function planQuota(plan, week, profile, offset = 0) {
  let muscu = 0, cardio = 0;
  weekDates(offset).forEach((dk) => {
    plannedList(dk, plan, week).forEach((s) => { if (s === "cardio") cardio++; else muscu++; });
  });
  return { muscu, cardio, goalM: profile.muscuDays || 0, goalC: profile.cardioDays || 0 };
}

/* ---------------- Stockage persistant (Claude / localStorage / mémoire) ---------------- */
const memFallback = {};
const backend = {
  async get(k) {
    if (typeof window !== "undefined" && window.storage) {
      try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) { return null; }
    }
    try { return localStorage.getItem(k); } catch (e) { return memFallback[k] ?? null; }
  },
  async set(k, v) {
    if (typeof window !== "undefined" && window.storage) {
      try { await window.storage.set(k, v); return; } catch (e) {}
    }
    try { localStorage.setItem(k, v); } catch (e) { memFallback[k] = v; }
  },
};
const store = {
  async load(key, fallback) {
    try { const v = await backend.get(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  async save(key, val) {
    try { await backend.set(key, JSON.stringify(val)); } catch (e) { console.error("save", key, e); }
  },
};

/* Feuille modale : verre épais, poignée, entrée avec rebond */
/* Feuille modale.
   Elle est montée à la RACINE de la page (portail) et non à l'endroit où elle est écrite :
   les cartes en verre (backdrop-filter / isolation) créent leurs propres couches d'affichage
   et enfermeraient la feuille sous la barre d'onglets, qui masquerait alors les boutons de
   validation. Au niveau du <body>, elle passe toujours au-dessus de tout. */
const Sheet = ({ open, onClose, children, title, full, footer }) => {
  if (!open) return null;
  const node = (
    <div role="dialog" aria-modal="true" aria-label={title} onClick={onClose}
      style={{ position: "fixed", inset: 0, background: C.overlay, zIndex: 1000, display: "flex", alignItems: "flex-end", justifyContent: "center", animation: "fadeIn .22s ease", color: C.text, fontFamily: FONT }}>
      <div className="lg sheet" onClick={(e) => e.stopPropagation()}
        style={{ borderRadius: "32px 32px 0 0", width: "100%", maxWidth: 520, maxHeight: full ? "calc(100dvh - env(safe-area-inset-top) - 12px)" : "88dvh", display: "flex", flexDirection: "column", animation: "sheetIn .42s cubic-bezier(.32,1.25,.5,1)", borderBottom: "none" }}>
        <div style={{ display: "flex", justifyContent: "center", paddingTop: 8, flexShrink: 0 }}>
          <span style={{ width: 36, height: 5, borderRadius: 3, background: C.track }} />
        </div>
        <div style={{ padding: "10px 20px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexShrink: 0 }}>
          <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: -0.5 }}>{title}</div>
          <button aria-label="Fermer" onClick={onClose} className="press" style={{ background: C.card2, border: "none", borderRadius: "50%", width: 32, height: 32, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.sub, cursor: "pointer" }}><Icon d={IC.x} size={15} sw={2.4} /></button>
        </div>
        <div style={{ overflowY: "auto", flex: "1 1 auto", minHeight: 0, padding: footer ? "4px 20px 16px" : "4px 20px calc(28px + env(safe-area-inset-bottom))", WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }}>{children}</div>
        {footer && (
          <div style={{ flexShrink: 0, padding: "12px 20px calc(16px + env(safe-area-inset-bottom))", borderTop: `0.5px solid ${C.line}`, display: "flex", gap: 10, background: "inherit", borderRadius: 0 }}>{footer}</div>
        )}
      </div>
    </div>
  );
  const canPortal = typeof ReactDOM !== "undefined" && ReactDOM.createPortal && typeof document !== "undefined" && document.body && document.body.appendChild;
  return canPortal ? ReactDOM.createPortal(node, document.body) : node;
};

/* Aurore d'arrière-plan : quelques halos flous dont la teinte suit la couleur
   d'accent. Sans eux, le verre n'a rien à réfracter et paraît gris et plat. */
function Ambient() {
  if (C.hacker) {
    return <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none", background: "radial-gradient(60% 40% at 50% 0%, rgba(57,255,20,0.10), transparent 70%), #000" }} />;
  }
  if (C.fun) {
    return <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none", background: C.bg }} />;
  }
  const dark = C.mode === "dark";
  const a = C.accent;
  const halo = (x, y, w, col, op) => ({ position: "absolute", left: x, top: y, width: w, height: w, borderRadius: "50%", background: col, opacity: op, filter: "blur(70px)" });
  return (
    <div aria-hidden="true" style={{ position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none", overflow: "hidden", background: dark ? "#000" : MODES.light.bg }}>
      <div style={halo("-18%", "-12%", "70vmax", a, dark ? 0.30 : 0.28)} />
      <div style={halo("55%", "8%", "55vmax", dark ? "#5E5CE6" : "#7FB2FF", dark ? 0.26 : 0.34)} />
      <div style={halo("10%", "62%", "60vmax", dark ? "#30D158" : "#FFC8A8", dark ? 0.14 : 0.40)} />
    </div>
  );
}

/* Bulle d'aide pour débutants : un « ? » qui déplie une explication en une phrase */

/* Anneau façon Apple Fitness : trait épais, extrémités arrondies, piste teintée */
function Ring({ size = 196, stroke = 20, pct, center, sub, over }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const p = clamp(pct, 0, 1);
  const off = circ * (1 - p);
  const col = over ? "#FF3B30" : C.accent;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)", overflow: "visible" }}>
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            {C.stops.map((c, i) => <stop key={i} offset={`${(i / Math.max(1, C.stops.length - 1)) * 100}%`} stopColor={c} />)}
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={hexA(col, 0.16)} strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={over ? col : "url(#ringGrad)"} strokeWidth={stroke} fill="none" strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={off} className="ring-fill"
          style={{ filter: `drop-shadow(0 0 6px ${hexA(col, 0.35)})` }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
        <div style={{ fontFamily: NUM, fontSize: size * 0.22, fontWeight: 700, letterSpacing: -1.5, lineHeight: 1, color: over ? "#FF3B30" : C.text, fontVariantNumeric: "tabular-nums", textShadow: C.hacker && !over ? C.glow : "none" }}>{center}</div>
        <div style={{ fontSize: 13, fontWeight: 600, color: C.sub, marginTop: 6, maxWidth: size * 0.62 }}>{sub}</div>
      </div>
    </div>
  );
}

function MacroBar({ label, val, target, color }) {
  const pct = target > 0 ? clamp(val / target, 0, 1) : 0;
  const over = val > target * 1.05;
  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 7 }}>
        <span style={{ fontSize: 13, fontWeight: 600, color: C.sub }}>{label}</span>
        <span style={{ fontFamily: NUM, fontSize: 12.5, fontWeight: 700, color: over ? "#FF3B30" : pct >= 1 ? C.good : C.faint, fontVariantNumeric: "tabular-nums" }}>{target > 0 ? Math.round((val / target) * 100) : 0}%</span>
      </div>
      <div style={{ height: 8, background: hexA(color, 0.16), borderRadius: 4, overflow: "hidden" }}>
        <div style={{ width: `${pct * 100}%`, height: "100%", background: over ? "#FF3B30" : color, borderRadius: 4, transition: "width .6s cubic-bezier(.32,1.1,.5,1)" }} />

        {Math.round(val)}<span style={{ color: C.faint, fontWeight: 600, fontSize: 13 }}> / {target} g</span>
      </div>
    </div>
  );
}

function WeekProgress({ profile, weights }) {
  const [range, setRange] = useState("week");
  const sorted = [...weights].sort((a, b) => (a.date < b.date ? -1 : 1));
  const today = dateKey();
  const last = sorted[sorted.length - 1];
  const start = +profile.poidsInitial || (sorted[0] && sorted[0].kg) || 0;
  const goal = +profile.poidsCible || 0;
  const cur = last ? +last.kg : start;
  const tot = start - goal;
  const pct = tot > 0 ? Math.max(0, Math.min(100, Math.round(((start - cur) / tot) * 100))) : 0;
  const lostTot = Math.round((start - cur) * 10) / 10;
  const weekAgo = shiftKey(today, -7);
  const before = [...sorted].reverse().find((w) => w.date <= weekAgo);
  const inWeek = sorted.filter((w) => w.date > weekAgo);
  const ref = before || inWeek[0];
  const avg = (a) => a.reduce((x, w) => x + +w.kg, 0) / a.length;
  const curW = sorted.filter((w) => w.date >= shiftKey(today, -6));
  const prevW = sorted.filter((w) => w.date >= shiftKey(today, -13) && w.date < shiftKey(today, -6));
  const byAvg = curW.length > 0 && prevW.length > 0;
  const lostWeek = byAvg ? Math.round((avg(prevW) - avg(curW)) * 10) / 10 : ref && last ? Math.round((ref.kg - last.kg) * 10) / 10 : null;
  const remaining = Math.max(0, Math.round((cur - goal) * 10) / 10);
  const mean = (a) => a.reduce((x, v) => x + v, 0) / a.length;
  const rate = (() => {
    const win = sorted.filter((w) => w.date >= shiftKey(today, -14));
    const a = win.length >= 3 ? win : sorted;
    if (a.length < 2) return null;
    const t0 = parseKey(a[0].date).getTime();
    const x = a.map((w) => (parseKey(w.date).getTime() - t0) / 86400000), y = a.map((w) => +w.kg);
    if (x[x.length - 1] < 3) return null;
    const mx = mean(x), my = mean(y);
    const den = x.reduce((acc, v) => acc + (v - mx) * (v - mx), 0);
    return den ? -(x.reduce((acc, v, i) => acc + (v - mx) * (y[i] - my), 0) / den) * 7 : null;
  })();
  const dose7 = Math.round(weights.filter((w) => w.dose && w.date > shiftKey(today, -7)).reduce((x, w) => x + (+w.mg || 0), 0) * 100) / 100;
  const fmtLong = (k) => { const d = parseKey(k); return fmtDate(k) + (d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""); };
  let etaMain, etaSub = "";
  if (!goal) etaMain = "Définis ton poids cible dans les réglages";
  else if (remaining <= 0) etaMain = "Objectif atteint 🎉";
  else if (rate == null) etaMain = "Pèse-toi sur quelques jours pour estimer la durée";
  else if (rate < 0.05) etaMain = "Pas de baisse mesurée : estimation impossible";
  else {
    const wk = remaining / rate;
    const eta = shiftKey(today, Math.round(wk * 7));
    etaMain = wk > 104 ? "Plus de 2 ans au rythme actuel" : `≈ ${wk < 1.5 ? "1 semaine" : Math.round(wk) + " semaines"} · vers le ${fmtLong(eta)}`;
    etaSub = `au rythme actuel de −${fr1(Math.round(rate * 10) / 10)} kg/sem`;
  }
  if (goal && remaining > 0 && profile.dateCible) {
    const dl = Math.round((parseKey(profile.dateCible).getTime() - parseKey(today).getTime()) / 86400000);
    if (dl > 0) etaSub += `${etaSub ? " · " : ""}pour le ${fmtLong(profile.dateCible)} : −${fr1(Math.round((remaining / (dl / 7)) * 10) / 10)} kg/sem`;
  }
  const pts = range === "week" ? (before ? [before, ...inWeek] : inWeek) : sorted;
  const W = 340, H = 170, P = { l: 34, r: 12, t: 14, b: 24 };
  const xs = pts.map((p) => parseKey(p.date).getTime());
  const ys = pts.map((p) => +p.kg).concat(range === "all" && goal ? [goal] : []);
  const minX = Math.min(...xs), maxX = Math.max(...xs, minX + 86400000);
  const lo = ys.length ? Math.min(...ys) - 0.5 : 0, hi = ys.length ? Math.max(...ys) + 0.5 : 1;
  const X = (t) => P.l + ((t - minX) / (maxX - minX)) * (W - P.l - P.r);
  const Y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(parseKey(p.date).getTime()).toFixed(1)},${Y(+p.kg).toFixed(1)}`).join(" ");
  const labelSet = new Set(); { let lx = Infinity; for (let i = pts.length - 1; i >= 0; i--) { const x = X(parseKey(pts[i].date).getTime()); if (lx - x >= 34 && (range === "week" && pts.length <= 8 || i === 0 && false)) { labelSet.add(i); lx = x; } else if (i === pts.length - 1) { labelSet.add(i); lx = x; } } }
  const grid = [lo + 0.25 * (hi - lo), (lo + hi) / 2, lo + 0.75 * (hi - lo)];
  const lossColor = lostWeek == null ? C.faint : lostWeek > 0 ? C.good : lostWeek < 0 ? C.fat : C.sub;

function DoseRecap({ weights }) {
  const today = dateKey();
  const doses = weights.filter((w) => w.dose).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!doses.length) return null;
  const sum = (a) => Math.round(a.reduce((x, w) => x + (+w.mg || 0), 0) * 100) / 100;
  const total = sum(doses);
  const week = sum(doses.filter((w) => w.date > shiftKey(today, -7)));
  const days = Math.max(1, Math.round((parseKey(today).getTime() - parseKey(doses[0].date).getTime()) / 86400000) + 1);
  const perWeek = Math.round((total / Math.max(1, days / 7)) * 100) / 100;
  const stat = (v, l) => (<div style={{ flex: 1, textAlign: "center" }}><div style={{ fontFamily: NUM, fontSize: 21, fontWeight: 800, color: BLUE }}>{fr1(v)}<span style={{ fontSize: 12, fontWeight: 700 }}> mg</span></div><div style={{ fontSize: 11.5, fontWeight: 700, color: C.faint, marginTop: 2 }}>{l}</div></div>);
  return (
    <Card style={{ padding: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}><Label>💉 Prises</Label><span style={{ fontSize: 12.5, fontWeight: 700, color: C.faint }}>{doses.length} prise{doses.length > 1 ? "s" : ""}</span></div>
      <div style={{ display: "flex" }}>{stat(total, "Total injecté")}{stat(week, "7 derniers jours")}{stat(perWeek, "Moy. / semaine")}</div>
    </Card>
  );
}

function useZXing() {
  const [ready, setReady] = useState(!!(window.ZXingBrowser || window.ZXing));
  useEffect(() => {
    if (ready) return;
    const src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js";
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { existing.addEventListener("load", () => setReady(true)); return; }
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => setReady(true);
    s.onerror = () => setReady(false);
    document.head.appendChild(s);
  }, []);
  return ready;
}

/* Formats réellement utilisés sur les produits alimentaires : restreindre la recherche
   accélère le scan ET réduit les faux négatifs (le lecteur ne perd pas de temps sur QR/Aztec/DataMatrix). */
function buildHints(tryHarder) {
  const ZX = window.ZXingBrowser || window.ZXing;
  const { DecodeHintType, BarcodeFormat } = ZX;
  const hints = new Map();
  hints.set(DecodeHintType.POSSIBLE_FORMATS, [
    BarcodeFormat.EAN_13, BarcodeFormat.EAN_8, BarcodeFormat.UPC_A, BarcodeFormat.UPC_E,
    BarcodeFormat.CODE_128, BarcodeFormat.CODE_39, BarcodeFormat.ITF,
  ]);
  if (tryHarder) hints.set(DecodeHintType.TRY_HARDER, true);
  return hints;
}

async function fetchWithTimeout(url, ms = 8000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, { signal: ctrl.signal }); } finally { clearTimeout(t); }
}

async function fetchProductJSON(code) {
  const target = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,quantity,product_quantity,serving_size,serving_quantity,nutrition_data_per,categories_tags`;
  const attempts = [
    () => fetchWithTimeout(target),
    () => fetchWithTimeout(`https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`, 10000),
    () => fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`, 10000),
  ];
  for (const attempt of attempts) {
    try {
      const res = await attempt();
      if (res.ok) return await res.json();
    } catch (e) {}
  }
  throw new Error("network");
}

async function lookupBarcode(code) {
  const data = await fetchProductJSON(code);
  if (!data || data.status !== 1 || !data.product) return null;
  const n = data.product.nutriments || {};
  const k = n["energy-kcal_100g"] ?? (n["energy_100g"] ? n["energy_100g"] / 4.184 : null);
  if (k == null) return null;
  const prod = data.product;
  const name = [prod.product_name, prod.brands].filter(Boolean).join(" — ") || "Produit scanné";
  // Micros OFF : stockés en unités SI (g) -> conversion mg / µg
  const mg = (v) => (v != null ? r1(v * 1000) : 0);

  // Boisson ? OFF indique soit des valeurs "pour 100 ml", soit un volume dans la quantité
  const qteTxt = String(prod.quantity || "");
  const cats = (prod.categories_tags || []).join(" ");
  const liquide = prod.nutrition_data_per === "100ml"
    || /\b\d+([.,]\d+)?\s*(ml|cl|l)\b/i.test(qteTxt)
    || /beverages|boissons|drinks|milk|laits|jus/i.test(cats);

  // Contenance du paquet -> propose "1 unité = tout le produit" quand c'est une portion crédible
  let unite = null;
  const contenance = +prod.product_quantity || null; // en g ou ml
  const portion = +prod.serving_quantity || null;
  if (portion && portion >= 10 && portion <= 1000) unite = { label: prod.serving_size || "portion", grams: portion };
  else if (contenance && contenance >= 10 && contenance <= 1000) unite = { label: qteTxt || "unité", grams: contenance };

  return {
    id: "bc" + code, name, cat: "Scanné",
    k: r1(k), p: r1(n.proteins_100g || 0), g: r1(n.carbohydrates_100g || 0), l: r1(n.fat_100g || 0),
    fe: mg(n.iron_100g), zn: mg(n.zinc_100g), b12: n["vitamin-b12_100g"] != null ? r1(n["vitamin-b12_100g"] * 1e6) : 0,
    vc: mg(n["vitamin-c_100g"]), ca: mg(n.calcium_100g), fib: r1(n.fiber_100g || 0),
    liquide, unite,
  };
}

function BarcodeScanner({ open, onClose, onFound }) {
  const videoRef = useRef(null);
  const fileRef = useRef(null);
  const readerRef = useRef(null);
  const trackRef = useRef(null);
  const [status, setStatus] = useState("init"); // init | scanning | looking | notfound | error | denied | unsupported
  const [manual, setManual] = useState("");
  const [torchOn, setTorchOn] = useState(false);
  const [torchAvailable, setTorchAvailable] = useState(false);
  const ready = useZXing();
  const camSupported = typeof navigator !== "undefined" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;

  useEffect(() => {
    if (!open || !ready || !camSupported) { if (open && !camSupported) setStatus("unsupported"); return; }
    setStatus("scanning");
    setTorchOn(false); setTorchAvailable(false);
    const ZX = window.ZXingBrowser || window.ZXing;
    const reader = new ZX.BrowserMultiFormatReader(buildHints(false), 120); // scan ~toutes les 120ms au lieu de 500ms par défaut
    readerRef.current = reader;
    let stopped = false;
    const constraints = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 }, advanced: [{ focusMode: "continuous" }] } };
    reader.decodeFromConstraints(constraints, videoRef.current, async (result, err) => {
      if (stopped || !result) return;
      const code = result.getText();
      stopped = true;
      try { reader.reset(); } catch (e) {}
      setStatus("looking");
      try {
        const food = await lookupBarcode(code);
        if (food) onFound(food); else { setManual(code); setStatus("notfound"); }
      } catch (e) { setManual(code); setStatus("error"); }
    }).catch(() => setStatus("denied"));
    // Détection de la torche une fois le flux vidéo actif
    const checkTorch = setInterval(() => {
      const stream = videoRef.current && videoRef.current.srcObject;
      const track = stream && stream.getVideoTracks && stream.getVideoTracks()[0];
      if (track) {
        trackRef.current = track;
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.torch) { setTorchAvailable(true); clearInterval(checkTorch); }
      }
    }, 400);
    return () => { stopped = true; clearInterval(checkTorch); try { reader.reset(); } catch (e) {} };
  }, [open, ready, camSupported]);

  useEffect(() => { if (!open) setStatus(camSupported ? "init" : "unsupported"); }, [open]);

  const toggleTorch = async () => {
    const track = trackRef.current;
    if (!track) return;
    try { await track.applyConstraints({ advanced: [{ torch: !torchOn }] }); setTorchOn(!torchOn); } catch (e) {}
  };

  const submitManual = async () => {
    const code = manual.trim();
    if (!code) return;
    setStatus("looking");
    try {
      const food = await lookupBarcode(code);
      if (food) onFound(food); else setStatus("notfound");
    } catch (e) { setStatus("error"); }
  };

  const decodeFromFile = async (file) => {
    if (!ready) return;
    setStatus("looking");
    const ZX = window.ZXingBrowser || window.ZXing;
    const reader = new ZX.BrowserMultiFormatReader(buildHints(true)); // recherche approfondie sur une image fixe
    let code = null;
    // Tentative 1 : image telle quelle. Tentative 2 : recadrage central + contraste (utile si le code-barres est petit ou peu contrasté).
    const tryDecode = async (url) => { try { const r = await reader.decodeFromImageUrl(url); return r.getText(); } catch (e) { return null; } };
    const rawUrl = URL.createObjectURL(file);
    code = await tryDecode(rawUrl);
    if (!code) {
      try {
        const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = rawUrl; });
        const cv = document.createElement("canvas");
        // recadrage central (bande horizontale, là où se trouve un code-barres 1D) + agrandissement + contraste renforcé
        const cropW = img.width, cropH = Math.min(img.height, img.width * 0.6);
        const cropY = (img.height - cropH) / 2;
        const scale = Math.min(3, 1600 / cropW);
        cv.width = cropW * scale; cv.height = cropH * scale;
        const ctx = cv.getContext("2d");
        ctx.filter = "contrast(1.5) grayscale(1)";
        ctx.drawImage(img, 0, cropY, cropW, cropH, 0, 0, cv.width, cv.height);
        code = await tryDecode(cv.toDataURL("image/png"));
      } catch (e) {}
    }
    URL.revokeObjectURL(rawUrl);
    if (!code) { setStatus("notfound"); return; }
    try {
      const food = await lookupBarcode(code);
      if (food) onFound(food); else { setManual(code); setStatus("notfound"); }
    } catch (e) { setManual(code); setStatus("error"); }
  };


  return (
    <Sheet open={open} onClose={onClose} title="Scanner un produit" full>
      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {camSupported && (
          <div style={{ position: "relative", borderRadius: 18, overflow: "hidden", background: "#000", aspectRatio: "4/3" }}>
            <video ref={videoRef} style={{ width: "100%", height: "100%", objectFit: "cover", display: status === "scanning" || status === "looking" ? "block" : "none" }} muted playsInline />
            {status === "scanning" && (
              <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", pointerEvents: "none" }}>
                <div style={{ width: "72%", height: "38%", border: `2.5px solid ${C.accent}`, borderRadius: 14, boxShadow: "0 0 0 999px rgba(0,0,0,0.35)" }} />
              </div>
            )}
            {status === "scanning" && torchAvailable && (
              <button onClick={toggleTorch} style={{ position: "absolute", bottom: 14, right: 14, width: 42, height: 42, borderRadius: "50%", border: "none", background: torchOn ? C.accent : "rgba(255,255,255,0.18)", color: "#fff", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                <Icon d={IC.bulb} size={19} />
              </button>
            )}
            {status === "init" && (
              <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.faint, fontSize: 13 }}>Chargement de la caméra…</div>
            )}
            {status === "looking" && (
              <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, background: "rgba(0,0,0,0.55)" }}>
                <div style={{ width: 30, height: 30, border: `3px solid ${C.accent}`, borderTopColor: "transparent", borderRadius: "50%", animation: "spin .8s linear infinite" }} />
                <div style={{ color: "#fff", fontSize: 13, fontWeight: 700 }}>Recherche du produit…</div>
              </div>
            )}
            {(status === "denied" || status === "error" || status === "notfound") && (
              <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, padding: 20, textAlign: "center" }}>
                <Icon d={IC.alert} size={26} color={C.bad} />
                <div style={{ color: "#fff", fontSize: 13.5, fontWeight: 700, lineHeight: 1.5 }}>
                  {status === "denied" && "Caméra refusée ou bloquée par l'aperçu — utilise l'import de photo ou la saisie manuelle ci-dessous."}
                  {status === "error" && "Le code a bien été lu, mais la connexion à la base produits a échoué. Réessaie, ou valide le code pré-rempli ci-dessous."}
                  {status === "notfound" && "Produit introuvable dans la base — vérifie le code ci-dessous ou réessaie."}
                </div>
              </div>
            )}
          </div>
        )}
        <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
        {camSupported ? (
          <div style={{ fontSize: 12.5, color: C.faint, textAlign: "center", lineHeight: 1.5 }}>Vise le code-barres, bien centré et net. Si la caméra ne s'active pas (aperçu intégré, permissions), utilise l'une des options ci-dessous.</div>
        ) : (
          <div style={{ background: C.card2, borderRadius: 14, padding: 13, fontSize: 13, color: C.sub, lineHeight: 1.55 }}>La caméra en direct n'est pas disponible ici (aperçu sans accès caméra, ou page non ouverte en HTTPS). Utilise l'import de photo ou la saisie manuelle — les deux fonctionnent partout.</div>
        )}

        <button onClick={() => fileRef.current && fileRef.current.click()} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 10, padding: "13px 14px", borderRadius: 14, border: `1px solid ${C.line}`, background: C.card2, color: C.text, fontWeight: 700, fontSize: 14.5, fontFamily: FONT, cursor: "pointer" }}>
          <Icon d={IC.camera} size={18} /> Importer une photo du code-barres
        </button>
        <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) decodeFromFile(f); e.target.value = ""; }} style={{ display: "none" }} />

        <div style={{ height: 1, background: C.line, margin: "2px 0" }} />
        <Label>Ou saisis le code-barres manuellement</Label>
        <div style={{ display: "flex", gap: 9 }}>
          <div style={{ flex: 1, display: "flex", alignItems: "center", background: C.card2, border: `1px solid ${C.line}`, borderRadius: 14, padding: "0 14px" }}>
            <input inputMode="numeric" value={manual} onChange={(e) => setManual(e.target.value.replace(/\D/g, ""))} placeholder="Ex : 3017620422003" style={{ background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 15.5, fontFamily: FONT, padding: "13px 0", width: "100%" }} />
          </div>
          <button onClick={submitManual} disabled={!manual.trim()} style={{ padding: "0 20px", borderRadius: 14, border: "none", background: manual.trim() ? C.accent : C.disabled, color: "#fff", fontWeight: 800, fontSize: 14, fontFamily: FONT, cursor: manual.trim() ? "pointer" : "default" }}>OK</button>
        </div>
      </div>
    </Sheet>
  );
}

function FoodPicker({ open, onClose, foods, mealDefault, onAdd, onCreateFood, favorites, onToggleFav, recents, mealsDispo }) {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState(null);
  const [sel, setSel] = useState(null);
  const [grams, setGrams] = useState("100");
  const [unit, setUnit] = useState("g");
  const [meal, setMeal] = useState(mealDefault);
  const [creating, setCreating] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [nf, setNf] = useState({ name: "", k: "", p: "", g: "", l: "" });
  useEffect(() => { if (open) { setQ(""); setCat(null); setSel(null); setGrams("100"); setMeal(mealDefault); setCreating(false); setScanning(false); setNf({ name: "", k: "", p: "", g: "", l: "" }); } }, [open, mealDefault]);

  const list = useMemo(() => {
    const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    let base = foods;
    if (cat === "fav") base = foods.filter((f) => favorites.includes(f.id));
    else if (cat) base = foods.filter((f) => f.cat === cat);
    return base.filter((f) => !q || norm(f.name).includes(norm(q)));
  }, [foods, q, cat, favorites]);

  const kcalOf = (f, g) => Math.round((f.k * g) / 100);
  const gEff = sel ? enGrammes(grams, unit, sel) : 0; // quantité ramenée en grammes
  const pick = (f) => {
    setSel(f);
    // unité par défaut : cl pour une boisson, unité si le conditionnement est connu, sinon g
    const u = unitesPour(f)[0];
    setUnit(u);
    const parDefaut = u === "cl" ? 20 : u === "ml" ? 200 : u === "u" ? 1 : f.lastGrams || 100;
    setGrams(String(parDefaut));
  };

  return (
    <Sheet open={open} onClose={onClose} title={creating ? "Nouvel aliment" : sel ? "Quantité" : "Ajouter un aliment"} full>
      {creating ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Field label="Nom de l'aliment" type="text" value={nf.name} onChange={(v) => setNf({ ...nf, name: v })} placeholder="Ex : Granola maison" />
          <Label>Valeurs pour 100 g</Label>
          <div style={{ display: "flex", gap: 10 }}>
            <Field label="Kcal" value={nf.k} onChange={(v) => setNf({ ...nf, k: v })} />
            <Field label="Prot." value={nf.p} onChange={(v) => setNf({ ...nf, p: v })} suffix="g" />
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Field label="Gluc." value={nf.g} onChange={(v) => setNf({ ...nf, g: v })} suffix="g" />
            <Field label="Lip." value={nf.l} onChange={(v) => setNf({ ...nf, l: v })} suffix="g" />
          </div>
          <Btn disabled={!nf.name || nf.k === ""} onClick={() => {
            const food = { id: "c" + uid(), name: nf.name.trim(), cat: "Mes aliments", k: +nf.k || 0, p: +nf.p || 0, g: +nf.g || 0, l: +nf.l || 0 };
            onCreateFood(food); setSel(food); setCreating(false);
          }}>Créer l'aliment</Btn>
        </div>
      ) : sel ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <div style={{ background: C.card2, borderRadius: 16, padding: 15 }}>
            <div style={{ fontWeight: 800, fontSize: 16 }}>{sel.name}</div>
            <div style={{ fontSize: 13, color: C.sub, marginTop: 3 }}>{Math.round(sel.k)} kcal · P {sel.p} · G {sel.g} · L {sel.l} <span style={{ color: C.faint }}>(pour 100 {estLiquide(sel) ? "ml" : "g"})</span></div>
          </div>
          {unitesPour(sel).length > 1 && (
            <div>
              <Label style={{ marginBottom: 8 }}>Unité</Label>
              <div style={{ display: "flex", gap: 8 }}>
                {unitesPour(sel).map((u) => (
                  <button key={u} onClick={() => {
                    setUnit(u);
                    setGrams(String(u === "cl" ? 20 : u === "ml" ? 200 : u === "u" ? 1 : 100));
                  }} style={{ flex: 1, padding: "10px 0", borderRadius: 12, border: `1.5px solid ${unit === u ? C.accent : C.line}`, background: unit === u ? C.accentSoft : C.card2, color: unit === u ? C.accent : C.sub, fontWeight: 800, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>
                    {u === "u" && sel.unite ? (sel.unite.label.length > 10 ? "unité" : sel.unite.label) : UNITES[u].label}
                  </button>
                ))}
              </div>
            </div>
          )}
          <Field label="Quantité" value={grams} onChange={setGrams} suffix={unit === "u" ? (grams > 1 ? "unités" : "unité") : UNITES[unit].court} />
          <div style={{ display: "flex", gap: 8 }}>
            {raccourcis(unit, sel).map((g) => (
              <button key={g} onClick={() => setGrams(String(g))} style={{ flex: 1, padding: "9px 0", borderRadius: 11, border: `1px solid ${+grams === g ? C.accent : C.line}`, background: +grams === g ? C.accentSoft : C.card2, color: +grams === g ? C.accent : C.sub, fontWeight: 700, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>{g} {unit === "u" ? "u" : UNITES[unit].court}</button>
            ))}
          </div>
          {unit !== "g" && (
            <div style={{ fontSize: 12.5, color: C.faint, marginTop: -8 }}>
              ≈ {Math.round(enGrammes(grams, unit, sel))} g{sel.unite && unit === "u" ? ` · ${sel.unite.label}` : ""}

          )}
          <div>

                  <Icon d={IC[m.icon]} size={16} /> {m.label}
                </button>
              ))}
            </div>
          </div>
          <div style={{ textAlign: "center", padding: "6px 0", fontSize: 15, color: C.sub }}>
            = <b style={{ color: C.text, fontSize: 20 }}>{kcalOf(sel, gEff)}</b> kcal · <span style={{ color: C.prot }}>P {r1((sel.p * gEff) / 100)}</span> · <span style={{ color: C.carb }}>G {r1((sel.g * gEff) / 100)}</span> · <span style={{ color: C.fat }}>L {r1((sel.l * gEff) / 100)}</span>
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <Btn kind="ghost" style={{ width: 90 }} onClick={() => setSel(null)}>Retour</Btn>
            <Btn disabled={!gEff} onClick={() => { onAdd({ id: uid(), foodId: sel.id, name: sel.name, per100: { k: sel.k, p: sel.p, g: sel.g, l: sel.l, ...foodMicros(sel) }, grams: gEff, qty: +grams, unit, meal }); onClose(); }}>Ajouter</Btn>
          </div>
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, background: C.card2, border: `1px solid ${C.line}`, borderRadius: 14, padding: "0 14px" }}>
            <Icon d={IC.search} size={17} color={C.faint} />
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Rechercher un aliment…" style={{ background: "transparent", border: "none", outline: "none", color: C.text, fontSize: 16, fontFamily: FONT, padding: "13px 0", width: "100%" }} />
          </div>
          {recents.length > 0 && !q && !cat && (
            <div>
              <Label style={{ marginBottom: 8 }}>Récents</Label>
              <div style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 4, WebkitOverflowScrolling: "touch" }}>
                {recents.map((f) => (
                  <button key={f.id} onClick={() => pick(f)} style={{ flexShrink: 0, padding: "8px 13px", borderRadius: 12, border: `1px solid ${C.line}`, background: C.card2, color: C.text, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer", whiteSpace: "nowrap", maxWidth: 170, overflow: "hidden", textOverflow: "ellipsis" }}>{f.name}</button>
                ))}
              </div>
            </div>
          )}
          <div style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 4, WebkitOverflowScrolling: "touch" }}>
            {[[null, "Tous"], ["fav", "Favoris"], ["Mes aliments", "Mes aliments"], ...FOOD_CATS.map((c) => [c, c])].map(([c, l]) => (
              <button key={l} onClick={() => setCat(c === cat ? null : c)} style={{ flexShrink: 0, display: "flex", alignItems: "center", gap: 5, padding: "7px 13px", borderRadius: 100, border: `1px solid ${cat === c ? C.accent : C.line}`, background: cat === c ? C.accentSoft : C.card2, color: cat === c ? C.accent : C.sub, fontWeight: 700, fontSize: 12.5, fontFamily: FONT, cursor: "pointer", whiteSpace: "nowrap" }}>

            <Icon d={IC.plus} size={17} /> Créer un aliment personnalisé
          </button>
          <div>
            {list.map((f) => <FoodRow key={f.id} f={f} onSelect={pick} isFav={favorites.includes(f.id)} onFav={onToggleFav} />)}
            {list.length === 0 && <div style={{ textAlign: "center", color: C.faint, padding: 30, fontSize: 14 }}>Aucun résultat — crée cet aliment avec le bouton ci-dessus, ou scanne son code-barres.</div>}
          </div>
        </div>
      )}
      <BarcodeScanner open={scanning} onClose={() => setScanning(false)} onFound={(food) => { setScanning(false); onCreateFood(food); pick(food); }} />
    </Sheet>
  );
}

              <span style={{ color: C.text, fontWeight: 600, fontSize: 14.5 }}>{f.name}</span>

          ))}
        </div>
        {items.length > 0 && (
          <div style={{ background: C.card2, borderRadius: 13, padding: "11px 14px", fontSize: 13.5, color: C.sub }}>
            Total : <b style={{ color: C.text }}>{Math.round(tot.k)} kcal</b> pour {Math.round(tot.w)} g · <span style={{ color: C.prot }}>P {r1(tot.p)}</span> · <span style={{ color: C.carb }}>G {r1(tot.g)}</span> · <span style={{ color: C.fat }}>L {r1(tot.l)}</span>
          </div>
        )}
        <Btn disabled={!name.trim() || items.length < 1} onClick={() => { onSave({ id: uid(), name: name.trim(), items }); onClose(); }}>Enregistrer ce repas favori</Btn>
      </div>
    </Sheet>
  );
}

/* ================================================================
   MENUS DU JOUR — interface distincte du journal :
   des assiettes prêtes à manger, calibrées sur le budget de chaque repas.
   ================================================================ */
function MenusView({ profile, targets, foods, budgetJour, onLog, dejaLogges }) {
  const actifs = repasActifs(profile);
  const regime = (profile && profile.regime) || "omnivore";
  // une suggestion par repas, régénérable individuellement
  // décalage initial par repas : sinon déjeuner et dîner tombent sur la même recette
  const [choix, setChoix] = useState(() => Object.fromEntries(actifs.map((m, i) => [m.id, i])));
  const suivant = (mealId) => {
    const n = recettesPour(mealId).length;
    setChoix((c) => ({ ...c, [mealId]: ((c[mealId] || 0) + 1) % Math.max(1, n) }));
  };
  const toutRegenerer = () => {
    const pris = {};
    setChoix(Object.fromEntries(actifs.map((m) => {
      const dispo = recettesPour(m.id, regime);
      let i = Math.floor(Math.random() * Math.max(1, dispo.length));
      // on évite de proposer deux fois le même plat dans la journée
      for (let n = 0; n < dispo.length && dispo[i] && pris[dispo[i].id]; n++) i = (i + 1) % dispo.length;
      if (dispo[i]) pris[dispo[i].id] = true;
      return [m.id, i];
    })));
  };

  const menus = actifs.map((m) => {
    const dispo = recettesPour(m.id, regime);
    if (!dispo.length) return { meal: m, recette: null };
    const budget = Math.round(budgetJour * partRepas(m.id, profile));
    const r = dispo[(choix[m.id] || 0) % dispo.length];
    return { meal: m, budget, recette: recetteAjustee(r, budget, foods) };
  });
  const totalJour = menus.reduce((s, x) => s + (x.recette ? x.recette.totaux.k : 0), 0);
  const totalP = menus.reduce((s, x) => s + (x.recette ? x.recette.totaux.p : 0), 0);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {/* Bandeau : le menu complet de la journée */}
      <div style={{ borderRadius: 22, padding: "20px 18px", background: gradCSS("135deg"), color: "#fff", position: "relative", overflow: "hidden" }}>
        <div style={{ fontSize: 11.5, fontWeight: 800, letterSpacing: 1.4, opacity: 0.9 }}>Menu du jour</div>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginTop: 6 }}>
          <span style={{fontFamily: NUM, fontSize: 34, fontWeight: 800, letterSpacing: -1, fontVariantNumeric: "tabular-nums" }}>{Math.round(totalJour)}</span>
          <span style={{ fontSize: 15, fontWeight: 700, opacity: 0.9 }}>/ {budgetJour} kcal</span>
        </div>
        <div style={{ fontSize: 13.5, marginTop: 4, opacity: 0.92 }}>{Math.round(totalP)} g de protéines · {actifs.length} repas · {regime === "vegan" ? "100 % végétal" : regime === "vegetarien" ? "végétarien" : "équilibré"}</div>
        <button onClick={toutRegenerer} style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 8, background: "rgba(255,255,255,0.22)", border: "none", borderRadius: 100, padding: "10px 16px", color: "#fff", fontWeight: 800, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>
          <Icon d={IC.bolt} size={15} color="#fff" /> Proposer un autre menu
        </button>
      </div>

      {menus.map(({ meal, budget, recette }) => {
        if (!recette) return null;
        const t = recette.totaux;
        const dejaFait = dejaLogges.includes(meal.id);
        return (
          <div key={meal.id} style={{ borderRadius: 20, overflow: "hidden", border: `1px solid ${C.line}`, background: C.card }}>
            {/* En-tête du repas */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "13px 16px", background: C.card2 }}>
              <Icon d={IC[meal.icon]} size={17} color={C.accent} />
              <span style={{ fontWeight: 800, fontSize: 15 }}>{meal.label}</span>
              <span style={{fontFamily: NUM, marginLeft: "auto", fontSize: 12.5, fontWeight: 700, color: C.faint, fontVariantNumeric: "tabular-nums" }}>objectif {budget} kcal</span>
            </div>

            <div style={{ padding: "15px 16px" }}>
              <div style={{ fontSize: 17.5, fontWeight: 800, letterSpacing: -0.3, lineHeight: 1.3 }}>{recette.nom}</div>
              <div style={{ display: "flex", gap: 7, marginTop: 10, flexWrap: "wrap" }}>
                {[[Math.round(t.k), "kcal", C.accent], [Math.round(t.p) + " g", "prot.", C.prot], [Math.round(t.g) + " g", "gluc.", C.carb], [Math.round(t.l) + " g", "lip.", C.fat]].map(([v, l, col]) => (
                  <div key={l} style={{ background: hexA(col, 0.12), borderRadius: 11, padding: "7px 11px" }}>
                    <span style={{fontFamily: NUM, fontWeight: 800, fontSize: 14, color: col, fontVariantNumeric: "tabular-nums" }}>{v}</span>
                    <span style={{ fontSize: 11, color: C.sub, fontWeight: 700, marginLeft: 5 }}>{l}</span>
                  </div>
                ))}
              </div>

              {/* Ce qu'il y a dans l'assiette, au gramme près */}
              <div style={{ marginTop: 14 }}>
                <Label style={{ marginBottom: 8, fontSize: 10 }}>À peser</Label>
                <div style={{ display: "flex", flexDirection: "column", gap: 1 }}>
                  {recette.items.map((it, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "9px 0", borderBottom: i < recette.items.length - 1 ? `1px solid ${C.line}` : "none" }}>
                      <span style={{ fontSize: 14, fontWeight: 600, flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.food.name}</span>
                      <span style={{fontFamily: NUM, fontSize: 14.5, fontWeight: 800, color: C.accent, fontVariantNumeric: "tabular-nums", marginLeft: 10 }}>{it.grams} g</span>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{ display: "flex", gap: 9, marginTop: 15 }}>
                <button onClick={() => suivant(meal.id)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "12px 0", borderRadius: 13, border: `1px solid ${C.line}`, background: C.card2, color: C.sub, fontWeight: 700, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>
                  <Icon d={IC.chevR} size={14} /> Autre idée
                </button>
                <button onClick={() => onLog(recette.items.map((it) => ({ id: uid(), name: it.food.name, per100: { k: it.food.k, p: it.food.p, g: it.food.g, l: it.food.l, ...foodMicros(it.food) }, grams: it.grams, meal: meal.id })))} style={{ flex: 1.3, display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "12px 0", borderRadius: 13, border: "none", background: dejaFait ? C.good : C.accent, color: "#fff", fontWeight: 800, fontSize: 13.5, fontFamily: FONT, cursor: "pointer" }}>
                  <Icon d={dejaFait ? IC.check : IC.plus} size={15} color="#fff" sw={2.6} /> {dejaFait ? "Déjà au journal" : "Je mange ça"}
                </button>
              </div>
            </div>
          </div>
        );
      })}

      <div style={{ fontSize: 12, color: C.faint, lineHeight: 1.5, textAlign: "center", padding: "0 10px" }}>
        Les quantités sont recalculées pour coller au budget de chaque repas. « Je mange ça » envoie tous les ingrédients dans le journal, où tu peux encore les ajuster.
      </div>
    </div>
  );
}

function NutritionTab({ profile, nutrition, setNutrition, targets, foods, addCustomFood, favorites, onToggleFav, recents, favMeals, onSaveFavMeal, onDeleteFavMeal, dayBurn = 0 }) {

  const entries = nutrition[day] || [];
  const tot = (m) => entries.reduce((s, e) => s + (e.per100[m] * e.grams) / 100, 0);
  const shiftDay = (n) => { const d = parseKey(day); d.setDate(d.getDate() + n); setDay(dateKey(d)); };
  const isToday = day === dateKey();

              </div>

function MiniLine({ pts, color, height = 90, unit = "kg" }) {
  const W = 300, H = height, P = { l: 8, r: 30, t: 14, b: 18 };
  if (pts.length < 2) return null;
  const xs = pts.map((p) => parseKey(p.date).getTime());
  const ys = pts.map((p) => p.v);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys) - 1, maxY = Math.max(...ys) + 1;
  const X = (t) => P.l + ((t - minX) / Math.max(1, maxX - minX)) * (W - P.l - P.r);
  const Y = (v) => P.t + (1 - (v - minY) / Math.max(0.1, maxY - minY)) * (H - P.t - P.b);
  const path = pts.map((p, i) => `${i ? "L" : "M"}${X(parseKey(p.date).getTime()).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", display: "block" }}>
      <path d={path} fill="none" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={X(parseKey(p.date).getTime())} cy={Y(p.v)} r={i === pts.length - 1 ? 4 : 2.6} fill={i === pts.length - 1 ? color : C.card} stroke={color} strokeWidth="1.6" />)}
      <text x={X(xs[xs.length - 1]) + 7} y={Y(ys[ys.length - 1]) + 4} fill={color} fontSize="11" fontWeight="800" fontFamily={FONT}>{ys[ys.length - 1]}{unit}</text>
      <text x={P.l} y={H - 4} fill={C.faint} fontSize="9" fontFamily={FONT} fontWeight="600">{fmtDate(pts[0].date)}</text>
      <text x={W - P.r} y={H - 4} textAnchor="end" fill={C.faint} fontSize="9" fontFamily={FONT} fontWeight="600">{fmtDate(pts[pts.length - 1].date)}</text>
    </svg>
  );
}

const exoHistory = (workouts, exoName) =>
  workouts
    .filter((w) => w.type === "muscu" && (w.exos || []).some((e) => e.name === exoName))
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .map((w) => {
      const ex = w.exos.find((e) => e.name === exoName);
      const best = Math.max(0, ...ex.sets.filter((s) => s.reps > 0).map((s) => s.kg));
      return { date: w.date, v: best, sets: ex.sets };
    })
    .filter((h) => h.v > 0);

/* Record personnel = le poids le plus lourd jamais soulevé sur cet exercice (toutes séances confondues) */
const prMaxForExo = (workouts, exoName) => {
  const hist = exoHistory(workouts, exoName);
  return hist.length ? Math.max(...hist.map((h) => h.v)) : 0;
};

/* 1RM estimé (formule d'Epley : charge × (1 + reps/30)), meilleur sur toutes les séances */
const est1RM = (workouts, exoName) => {
  const hist = exoHistory(workouts, exoName);
  let best = 0;
  hist.forEach((h) => h.sets.forEach((s) => {
    if (s.kg > 0 && s.reps > 0) best = Math.max(best, s.kg * (1 + Math.min(s.reps, 15) / 30));
  }));
  return Math.round(best * 2) / 2;
};

/* Liste de tous les exercices avec un record connu, triée par le plus récemment battu */
function allPRs(workouts) {
  const names = new Set();
  workouts.forEach((w) => { if (w.type === "muscu") (w.exos || []).forEach((e) => names.add(e.name)); });
  return [...names].map((name) => {
    const hist = exoHistory(workouts, name);
    if (!hist.length) return null;
    let best = 0, bestDate = hist[0].date;
    hist.forEach((h) => { if (h.v >= best) { best = h.v; bestDate = h.date; } });
    return { name, pr: best, date: bestDate };
  }).filter(Boolean).sort((a, b) => (a.date < b.date ? 1 : -1));
}

/* Série de jours consécutifs (jusqu'à aujourd'hui ou hier) où l'app a été utilisée :
   au moins un aliment loggé ou une séance enregistrée ce jour-là. */
function computeStreak(nutrition, workouts) {
  const daysWithActivity = new Set([
    ...Object.keys(nutrition).filter((d) => (nutrition[d] || []).length > 0),
    ...workouts.map((w) => w.date),
  ]);
  let streak = 0;
  let cursor = new Date();
  if (!daysWithActivity.has(dateKey(cursor))) cursor.setDate(cursor.getDate() - 1); // tolère de ne pas avoir encore loggé aujourd'hui
  while (daysWithActivity.has(dateKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}
